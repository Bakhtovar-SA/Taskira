<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:256px;height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;padding:12px 10px 10px;border-radius:16px;background:oklch(0.99 0.006 288 / 0.55);box-shadow:inset 0 0 0 1px oklch(1 0 0 / 0.85), 0 1px 2px oklch(0.3 0.04 288 / 0.05);font-family:Manrope, sans-serif;color:oklch(0.225 0.02 288)">
  <div style="display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 8px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.52 0.2 288)" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.05h18"></path><path d="M5.86 14.6 9.68 18.94 15.08 5.05"></path></svg>
    <span style="font-size:16px;font-weight:700;letter-spacing:-0.02em;flex:1">Taskira</span>
    <span style="width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:oklch(0.44 0.018 288)"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="3.5" fill="currentColor" opacity="0.26"></rect><rect x="3" y="3" width="3.5" height="10" rx="1.25" fill="currentColor"></rect></svg></span>
  </div>
  <div style="display:flex;gap:6px;margin:6px 0 10px">
    <div style="flex:1;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:9px;background:oklch(0.997 0.0015 288);box-shadow:0 0 0 1px oklch(0.895 0.009 288);color:oklch(0.49 0.016 288);font-size:13.5px">
      <svg width="15" height="15" viewBox="0 0 16 16" style="color:oklch(0.44 0.018 288)"><path fill="currentColor" fill-rule="evenodd" d="M7 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 2a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path><path fill="currentColor" d="m10.4 11.8 1.4-1.4 3 3a1 1 0 0 1-1.4 1.4z"></path></svg>
      <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Поиск и команды</span>
      <span style="font-size:11.5px;font-weight:600;padding:1px 5px;border-radius:5px;background:oklch(0.962 0.006 288);box-shadow:0 0 0 1px oklch(0.895 0.009 288)">Ctrl K</span>
    </div>
    <div title="Новая задача (C)" style="width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:oklch(0.997 0.0015 288);box-shadow:0 0 0 1px oklch(0.895 0.009 288);color:oklch(0.49 0.175 288)"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="3" width="12" height="12" rx="3" fill="currentColor" opacity="0.26"></rect><path fill="currentColor" d="M12.25 1.5a1.5 1.5 0 0 1 2.25 2.25L9 9.25 6 10l.75-3z"></path></svg></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:{{ home.w }};background:{{ home.bg }};color:{{ home.fg }}">
    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" opacity="0.26" d="M2 7.5 8 2.5l6 5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"></path><path fill="currentColor" d="M1 7.2 8 1.4l7 5.8-1 1.2L8 3.4 2 8.4z"></path><path fill="currentColor" d="M6.5 14v-3a1.5 1.5 0 0 1 3 0v3z"></path></svg><span style="flex:1">Главная</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:500;color:oklch(0.225 0.02 288)">
    <svg width="16" height="16" viewBox="0 0 16 16" style="color:oklch(0.44 0.018 288)"><path fill="currentColor" opacity="0.26" d="M2 5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"></path><path fill="currentColor" d="M2 9h3.25l1 1.5h3.5l1-1.5H14v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"></path></svg><span style="flex:1">Входящие</span>
    <span style="min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:oklch(0.55 0.2 288);color:oklch(0.99 0.006 288);font-size:11px;font-weight:700;display:grid;place-items:center">3</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:500;color:oklch(0.225 0.02 288)">
    <svg width="16" height="16" viewBox="0 0 16 16" style="color:oklch(0.44 0.018 288)"><circle cx="8" cy="8" r="7" fill="currentColor" opacity="0.26"></circle><path d="M5 8.25 7 10.25 11 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="flex:1">Мои задачи</span>
    <span style="font-size:12px;font-weight:600;color:oklch(0.49 0.016 288)">2</span>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;height:28px;padding:0 10px;margin-top:14px;font-size:12.5px;font-weight:600;color:oklch(0.49 0.016 288)"><span>Проекты</span><span style="font-size:16px;font-weight:500;line-height:1">+</span></div>
  <div style="display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;font-size:13px;font-weight:600;color:oklch(0.44 0.018 288)"><svg width="12" height="12" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Общий отдел</div>
  <sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
    <div style="display:flex;align-items:center;gap:9px;height:32px;padding:0 10px 0 22px;border-radius:8px;font-size:14px;font-weight:{{ p.w }};background:{{ p.bg }};box-shadow:{{ p.sh }}">
      <span style="width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:{{ p.soft }};color:{{ p.c }}">{{ p.l }}</span>
      <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.name }}</span>
      <sc-if value="{{ p.fav }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 16 16" style="color:oklch(0.76 0.14 78)"><path fill="currentColor" d="m8 1.5 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.3l-3.8 2 .7-4.3-3.1-3 4.3-.6z"></path></svg></sc-if>
    </div>
  </sc-for>
  <div style="display:flex;align-items:center;gap:8px;height:28px;padding:0 10px;font-size:13px;font-weight:600;color:oklch(0.44 0.018 288)"><svg width="12" height="12" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg><span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Отдел персонала и поддержки</span><span style="font-weight:500;color:oklch(0.49 0.016 288)">2</span></div>
  <div style="height:28px;padding:0 10px;margin-top:14px;display:flex;align-items:center;font-size:12.5px;font-weight:600;color:oklch(0.49 0.016 288)">Организация</div>
  <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:{{ roadmap.w }};background:{{ roadmap.bg }};color:{{ roadmap.fg }}">
    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" opacity="0.26" d="M4.5 2h9l-2 3.25 2 3.25h-9z"></path><rect x="2.5" y="1.5" width="2" height="13" rx="1" fill="currentColor"></rect></svg><span>Роадмап</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:{{ reports.w }};background:{{ reports.bg }};color:{{ reports.fg }}">
    <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="14" height="14" rx="3.5" fill="currentColor" opacity="0.26"></rect><rect x="3" y="9" width="2" height="4" rx="0.75" fill="currentColor"></rect><rect x="7" y="6" width="2" height="7" rx="0.75" fill="currentColor"></rect><rect x="11" y="3" width="2" height="10" rx="0.75" fill="currentColor"></rect></svg><span>Отчёты и дашборды</span>
  </div>
  <div style="flex:1"></div>
  <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;font-size:14px;font-weight:500;color:oklch(0.44 0.018 288)">
    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M1 3a1 1 0 0 1 1-1h4a2 2 0 0 1 2 2v10.25C7.5 13.5 6.75 13 6 13H1z"></path><path fill="currentColor" opacity="0.26" d="M15 3a1 1 0 0 0-1-1h-4a2 2 0 0 0-2 2v10.25c.5-.75 1.25-1.25 2-1.25h5z"></path></svg><span style="flex:1">Справка</span><span style="font-size:11.5px;font-weight:600;padding:0 5px;border-radius:5px;box-shadow:0 0 0 1px oklch(0.895 0.009 288)">?</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;margin-top:4px;border-top:1px solid oklch(0.925 0.007 288)">
    <span style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:oklch(0.62 0.15 350);color:oklch(0.99 0.006 288)">АС</span>
    <span style="flex:1;display:flex;flex-direction:column;line-height:1.25"><span style="font-size:13.5px;font-weight:600">Анна Смирнова</span><span style="font-size:12px;color:oklch(0.44 0.018 288)">Менеджер проекта</span></span>
    <svg width="16" height="16" viewBox="0 0 16 16" style="color:oklch(0.44 0.018 288)"><g fill="currentColor"><rect x="6.75" y=".75" width="2.5" height="3" rx=".75"></rect><rect x="6.75" y=".75" width="2.5" height="3" rx=".75" transform="rotate(45 8 8)"></rect><rect x="6.75" y=".75" width="2.5" height="3" rx=".75" transform="rotate(90 8 8)"></rect><rect x="6.75" y=".75" width="2.5" height="3" rx=".75" transform="rotate(135 8 8)"></rect><rect x="6.75" y=".75" width="2.5" height="3" rx=".75" transform="rotate(180 8 8)"></rect><rect x="6.75" y=".75" width="2.5" height="3" rx=".75" transform="rotate(225 8 8)"></rect><rect x="6.75" y=".75" width="2.5" height="3" rx=".75" transform="rotate(270 8 8)"></rect><rect x="6.75" y=".75" width="2.5" height="3" rx=".75" transform="rotate(315 8 8)"></rect><path fill-rule="evenodd" d="M8 2.75a5.25 5.25 0 1 1 0 10.5 5.25 5.25 0 0 1 0-10.5zM8 6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"></path></g></svg>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:256,&quot;height&quot;:884},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;project&quot;,&quot;roadmap&quot;,&quot;reports&quot;],&quot;default&quot;:&quot;project&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? "project";
    const on = { bg: "oklch(0.997 0.0015 288 / 0.92)", fg: "oklch(0.49 0.175 288)", w: 600 };
    const off = { bg: "transparent", fg: "oklch(0.225 0.02 288)", w: 500 };
    const P = [
      { name: "Запуск клиентского портала", l: "P", h: 190 },
      { name: "Корпоративные задачи", l: "C", h: 288, fav: true },
      { name: "Переход на электронный документооборот", l: "D", h: 60 },
    ];
    return {
      home: a === "home" ? on : off,
      roadmap: a === "roadmap" ? on : off,
      reports: a === "reports" ? on : off,
      projects: P.map((p) => {
        const cur = a === "project" && p.l === "C";
        return { ...p, c: `oklch(0.5 0.14 ${p.h})`, soft: `oklch(0.94 0.04 ${p.h})`, bg: cur ? "oklch(0.997 0.0015 288 / 0.92)" : "transparent", sh: cur ? "0 0 0 1px oklch(0.895 0.009 288), 0 1px 2px oklch(0.3 0.04 288 / 0.06)" : "none", w: cur ? 600 : 500 };
      }),
    };
  }
}
</script>
</body>
</html>

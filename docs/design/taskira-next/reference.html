<!doctype html>
<html lang="ru" data-theme="light">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taskira — документы, объекты, процессы и планы</title>
<style>
/* TASKIRA TOKENS BEGIN */
/* ============================================================================
   Taskira design tokens — ТЗ 5.4, ADR-0012 «Язык дизайна».

   Три слоя:
     1. Примитивы   — шкалы --violet-1…12, --gray-1…12, статусные тона,
                      палитра проектов. Тон 288 (индиго-фиолет) в OKLCH.
     2. Семантика   — --bg-*, --text-*, --border-*, --accent-*, --status-*,
                      --elev-*. ТЕМЫ ПЕРЕОПРЕДЕЛЯЮТ ТОЛЬКО ЭТОТ СЛОЙ.
     3. Алиасы      — старые имена --c-* (canvas/panel/ink/…) указывают на
                      семантику, поэтому все существующие экраны получают новую
                      палитру без правки разметки (docs/design/ALIASES.md).

   Роли ступеней шкал: 1–2 фоны, 3–5 фоны элементов, 6–8 границы,
   9–10 сплошная заливка, 11–12 текст.

   Правило: никаких #000/#fff. Самый светлый цвет — gray-1 с подтоном,
   самый тёмный — холст тёмной темы oklch(0.16 …), не чёрный.
   ========================================================================== */

:root {
  /* Роадмап: палитра проектов и контрастная заливка для небольшого белого ключа. */
  --roadmap-panel: color-mix(in oklch, var(--bg-panel) 60%, transparent);
  --roadmap-fill-start-l: 0.5;
  --roadmap-fill-end-l: 0.52;
  --roadmap-highlight: inset 0 1px 0 oklch(1 0 0 / 0.35);
  /* ─── 1. Примитивы: светлая тема ─────────────────────────────────────── */
  /* Оттенок бренда (ТЗ 5.14 п.5): 288 — фирменный фиолетовый; инсталляция может сдвинуть его в проверенном
     диапазоне contract.ts BRAND_HUE (src/brand.ts ставит --brand-h на <html> через CSSOM). Серые — всегда 288. */
  --brand-h: 288;
  --violet-1: oklch(0.992 0.004 var(--brand-h));
  --violet-2: oklch(0.978 0.011 var(--brand-h));
  --violet-3: oklch(0.955 0.024 var(--brand-h));
  --violet-4: oklch(0.932 0.040 var(--brand-h));
  --violet-5: oklch(0.905 0.058 var(--brand-h));
  --violet-6: oklch(0.865 0.078 var(--brand-h));
  --violet-7: oklch(0.805 0.102 var(--brand-h));
  --violet-8: oklch(0.725 0.138 var(--brand-h));
  --violet-9: oklch(0.55 0.2 var(--brand-h));
  --violet-10: oklch(0.505 0.2 var(--brand-h));
  --violet-11: oklch(0.49 0.175 var(--brand-h));
  --violet-12: oklch(0.3 0.1 var(--brand-h));

  --gray-1: oklch(0.993 0.002 288);
  --gray-2: oklch(0.982 0.004 288);
  --gray-3: oklch(0.962 0.006 288);
  --gray-4: oklch(0.945 0.006 288);
  --workspace-filter-line: var(--violet-6);
  --project-tabs-bg: var(--gray-4);
  --gray-5: oklch(0.928 0.006 288);
  --gray-6: oklch(0.905 0.007 288);
  --gray-7: oklch(0.872 0.008 288);
  --gray-8: oklch(0.8 0.01 288);
  --gray-9: oklch(0.62 0.012 288);
  --gray-10: oklch(0.575 0.013 288);
  --gray-11: oklch(0.47 0.016 288);
  --gray-12: oklch(0.225 0.02 288);

  /* Статусы: приглушённые, чтобы жить рядом с насыщенным брендом.
     Зелёный — только «готово». */
  --green-solid: oklch(0.6 0.13 158);
  --green-soft: oklch(0.955 0.03 158);
  --green-text: oklch(0.47 0.1 158);
  --amber-solid: oklch(0.76 0.14 78);
  --amber-soft: oklch(0.965 0.035 85);
  --amber-text: oklch(0.5 0.1 65);
  --red-solid: oklch(0.585 0.19 25);
  --red-soft: oklch(0.96 0.025 20);
  --red-text: oklch(0.52 0.18 25);
  --orange-solid: oklch(0.66 0.16 48);

  /* Палитра проектов/направлений: одна светлота и хрома, разные тона.
     Точный бренд-тон 288 в неё не входит. */
  --project-1: oklch(0.62 0.15 262);
  --project-2: oklch(0.62 0.15 312);
  --project-3: oklch(0.62 0.15 350);
  --project-4: oklch(0.62 0.15 25);
  --project-5: oklch(0.62 0.15 60);
  --project-6: oklch(0.62 0.15 150);
  --project-7: oklch(0.62 0.15 190);
  --project-8: oklch(0.62 0.15 230);

  /* ─── 2. Семантика: светлая тема ─────────────────────────────────────── */
  color-scheme: light;

  /* Поверхности, от дальней к ближней. frame — за боковой панелью (атмосфера),
     canvas — рабочая область, panel — карточки/шапки/поля, raised — поповеры,
     overlay — диалоги. */
  --bg-frame: oklch(0.958 0.009 288);
  --bg-canvas: oklch(0.978 0.004 288);
  --bg-sunken: oklch(0.962 0.006 288);
  --bg-group: oklch(0.975 0.005 288);
  --bg-panel: oklch(0.997 0.0015 288);
  --bg-raised: oklch(0.997 0.0015 288);
  --bg-overlay: oklch(0.997 0.0015 288);
  --bg-hover: oklch(0.95 0.008 288);
  --bg-active: oklch(0.93 0.012 288);
  --bg-scrim: oklch(0.24 0.03 288 / 0.34);
  /* стеклянные поверхности хрома (поповеры, боковая панель) */
  --bg-glass: oklch(0.995 0.003 288 / 0.78);
  --bg-sidebar: oklch(0.955 0.01 288 / 0.55);
  --sidebar-item-active: oklch(0.997 0.0015 288 / 0.92);

  --text-1: var(--gray-12);
  --text-2: oklch(0.44 0.018 288);
  --text-3: oklch(0.49 0.016 288);
  --text-on-accent: oklch(0.99 0.006 288);

  --border-subtle: oklch(0.925 0.007 288);
  --border-default: oklch(0.895 0.009 288);
  --border-strong: oklch(0.82 0.012 288);

  --accent-solid: var(--violet-9);
  --accent-hover: var(--violet-10);
  --accent-subtle: var(--violet-3);
  --accent-muted: var(--violet-5);
  --accent-text: var(--violet-11);
  --accent-glow: oklch(0.55 0.2 var(--brand-h) / 0.28);
  --focus-ring: oklch(0.55 0.2 var(--brand-h) / 0.42);

  --status-done: var(--green-solid);
  --status-done-bg: var(--green-soft);
  --status-done-fg: var(--green-text);
  --status-progress: var(--amber-solid);
  --status-progress-bg: var(--amber-soft);
  --status-progress-fg: var(--amber-text);
  --status-todo: oklch(0.6 0.02 288);
  --status-todo-bg: oklch(0.945 0.008 288);
  --status-todo-fg: oklch(0.44 0.02 288);
  --status-danger: var(--red-solid);
  --status-danger-bg: var(--red-soft);
  --status-danger-fg: var(--red-text);
  /* Сплошной красный под белым текстом (кнопка «опасно» при наведении): ≥ 4.5:1 с --text-on-accent. */
  --status-danger-strong: oklch(0.52 0.2 25);
  --status-warn: oklch(0.6 0.13 65);

  --type-task: var(--violet-9);
  --type-bug: var(--red-solid);
  --type-request: oklch(0.6 0.11 205);

  /* Категориальные цвета графиков дашбордов (ADR-0022). Порядок — механизм различимости, не вкус: проверен
     валидатором dataviz на наших поверхностях (соседние пары при протанопии/дейтеранопии ΔE ≥ 8.4, обычное зрение
     ≥ 19.3, первые три различимы попарно). Тон слота задаёт сущность, а не место в рейтинге. 3, 4 и 5 ниже 3:1 на
     светлом фоне — поэтому у каждого графика подписи со значениями рядом. */
  --chart-1: #4a3aa7;
  --chart-2: #eb6834;
  --chart-3: #1baf7a;
  --chart-4: #eda100;
  --chart-5: #e87ba4;
  --chart-6: #008300;
  --chart-7: #2a78d6;
  --chart-8: #e34948;

  /* Уровни подъёма. Светлая тема — многослойные тени с малой альфой,
     окрашенные в тон холста (не серые rgba(0,0,0,.1)). */
  --shadow-tint: 288;
  --elev-0: 0 0 0 0 transparent;
  --elev-1: 0 1px 2px oklch(0.3 0.04 288 / 0.06), 0 0 0 1px oklch(0.3 0.04 288 / 0.03);
  --elev-2: 0 1px 2px oklch(0.3 0.04 288 / 0.05), 0 4px 12px -2px oklch(0.3 0.05 288 / 0.08);
  --elev-3: 0 2px 4px oklch(0.3 0.04 288 / 0.05), 0 12px 32px -6px oklch(0.3 0.06 288 / 0.16);
  --elev-4: 0 4px 8px oklch(0.3 0.04 288 / 0.06), 0 28px 64px -12px oklch(0.25 0.07 288 / 0.28);
  --elev-accent: 0 1px 2px oklch(0.4 0.18 var(--brand-h) / 0.3), 0 4px 14px -4px oklch(0.55 0.2 var(--brand-h) / 0.5);
  --highlight-top: inset 0 1px 0 oklch(1 0 0 / 0.6);
  --highlight-accent: inset 0 1px 0 oklch(1 0 0 / 0.22);

  /* ─── Атмосфера (только за рабочим пространством — ТЗ 5.14) ───────────
     Три свечения за стеклом навигации и рабочего листа; зерно убрано
     решением владельца 25.09.2026 (ADR-0016). */
  --glow-a: oklch(0.78 0.13 288 / 0.75);
  --glow-b: oklch(0.86 0.1 20 / 0.55);
  --glow-c: oklch(0.86 0.09 220 / 0.55);

  /* Стекло хрома: боковая панель, рабочий лист, кромка. */
  --glass-side: oklch(0.99 0.006 288 / 0.5);
  --glass-sheet: oklch(0.99 0.004 288 / 0.7);
  --glass-edge: oklch(1 0 0 / 0.85);
  --glass-edge-2: oklch(1 0 0 / 0.2);
  /* Доска (часть F): плашка колонки заметно темнее листа и обведена, карточка — тонкой линией. Выводятся из
     семантических токенов темы, так что светлые облики (dawn, paper) подхватывают их сами. */
  --board-col-bg: color-mix(in oklch, var(--border-subtle) 62%, transparent);
  --board-col-line: var(--border-default);
  --board-card-line: oklch(0.3 0.04 288 / 0.1);

  /* Знак и фирменные тона иконок навигации. */
  --logo: oklch(0.52 0.2 var(--brand-h));
  /* Плашка иконки приложения (<Logo variant="app">): одна в обеих темах, следует за оттенком бренда. */
  --logo-plate-1: oklch(0.66 0.19 calc(var(--brand-h) + 12));
  --logo-plate-2: oklch(0.45 0.21 calc(var(--brand-h) - 10));
  --ic-l: 0.58;
  --ic-c: 0.14;

  /* ─── Прочие токены ──────────────────────────────────────────────────── */
  --radius-xs: 4px;
  --radius-s: 6px;
  --radius-m: 8px;
  --radius-l: 12px;
  --radius-xl: 16px;

  --dur-1: 100ms;
  --dur-2: 150ms;
  --dur-3: 200ms;
  --dur-4: 300ms;
  --dur-5: 450ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  --z-sticky: 10;
  --z-dropdown: 40;
  --z-modal: 50;
  --z-toast: 70;
  --z-tooltip: 80;
}

/* ─── 2'. Семантика: тёмная тема ──────────────────────────────────────── */
:root[data-theme="dark"] {
  --bg-group: var(--bg-sunken);
  color-scheme: dark;

  --violet-1: oklch(0.18 0.02 var(--brand-h));
  --violet-2: oklch(0.205 0.032 var(--brand-h));
  --violet-3: oklch(0.25 0.06 var(--brand-h));
  --violet-4: oklch(0.285 0.085 var(--brand-h));
  --violet-5: oklch(0.325 0.105 var(--brand-h));
  --violet-6: oklch(0.375 0.12 var(--brand-h));
  --violet-7: oklch(0.445 0.14 var(--brand-h));
  --violet-8: oklch(0.53 0.17 var(--brand-h));
  --violet-9: oklch(0.585 0.2 var(--brand-h));
  --violet-10: oklch(0.635 0.19 var(--brand-h));
  --violet-11: oklch(0.8 0.115 var(--brand-h));
  --violet-12: oklch(0.93 0.04 var(--brand-h));

  --gray-1: oklch(0.165 0.012 288);
  --gray-2: oklch(0.185 0.012 288);
  --gray-3: oklch(0.215 0.013 288);
  --gray-4: oklch(0.238 0.013 288);
  --gray-5: oklch(0.26 0.014 288);
  --gray-6: oklch(0.29 0.014 288);
  --gray-7: oklch(0.335 0.015 288);
  --gray-8: oklch(0.415 0.016 288);
  --gray-9: oklch(0.56 0.016 288);
  --gray-10: oklch(0.62 0.015 288);
  --gray-11: oklch(0.76 0.012 288);
  --gray-12: oklch(0.945 0.006 288);

  --green-solid: oklch(0.7 0.14 158);
  --green-soft: oklch(0.27 0.045 158);
  --green-text: oklch(0.8 0.12 158);
  --amber-solid: oklch(0.8 0.14 80);
  --amber-soft: oklch(0.29 0.045 75);
  --amber-text: oklch(0.84 0.12 80);
  --red-solid: oklch(0.66 0.18 25);
  --red-soft: oklch(0.28 0.06 22);
  --red-text: oklch(0.76 0.14 25);
  --orange-solid: oklch(0.74 0.14 52);

  --project-1: oklch(0.7 0.13 262);
  --project-2: oklch(0.7 0.13 312);
  --project-3: oklch(0.7 0.13 350);
  --project-4: oklch(0.7 0.13 25);
  --project-5: oklch(0.7 0.13 60);
  --project-6: oklch(0.7 0.13 150);
  --project-7: oklch(0.7 0.13 190);
  --project-8: oklch(0.7 0.13 230);

  /* Холст ≈ oklch(0.16 …) — не чёрный, с фиолетовым подтоном; каждый
     следующий слой светлее на 0.02–0.03 L. */
  --bg-frame: oklch(0.155 0.014 288);
  --bg-canvas: oklch(0.182 0.013 288);
  --bg-sunken: oklch(0.165 0.012 288);
  --bg-panel: oklch(0.212 0.014 288);
  --bg-raised: oklch(0.238 0.015 288);
  --bg-overlay: oklch(0.228 0.015 288);
  --bg-hover: oklch(0.255 0.016 288);
  --bg-active: oklch(0.285 0.02 288);
  --bg-scrim: oklch(0.08 0.02 288 / 0.62);
  --bg-glass: oklch(0.235 0.016 288 / 0.8);
  --bg-sidebar: oklch(0.15 0.014 288 / 0.5);
  --sidebar-item-active: oklch(0.3 0.03 288 / 0.55);

  --text-1: oklch(0.945 0.006 288);
  --text-2: oklch(0.78 0.012 288);
  --text-3: oklch(0.66 0.014 288);
  --text-on-accent: oklch(0.99 0.006 288);
  --status-danger-strong: oklch(0.52 0.19 25);

  --border-subtle: oklch(0.255 0.014 288);
  --border-default: oklch(0.29 0.016 288);
  --border-strong: oklch(0.37 0.018 288);

  /* Чуть глубже ступени 9 тёмной шкалы: светлый текст на кнопке держит 4.5:1. */
  --accent-solid: oklch(0.555 0.2 var(--brand-h));
  --accent-hover: oklch(0.525 0.2 var(--brand-h));
  --accent-subtle: oklch(0.28 0.07 var(--brand-h) / 0.7);
  --accent-muted: var(--violet-5);
  --accent-text: var(--violet-11);
  --accent-glow: oklch(0.62 0.2 var(--brand-h) / 0.35);
  --focus-ring: oklch(0.7 0.16 var(--brand-h) / 0.55);

  --status-todo: oklch(0.62 0.02 288);
  --status-todo-bg: oklch(0.265 0.014 288);
  --status-todo-fg: oklch(0.78 0.014 288);
  --status-warn: oklch(0.78 0.12 70);

  --type-request: oklch(0.72 0.1 205);

  /* Те же восемь тонов, ступени для тёмной поверхности (проверены на тёмной, «Сумерках» и «Графите»). */
  --chart-1: #9085e9;
  --chart-2: #d95926;
  --chart-3: #199e70;
  --chart-4: #c98500;
  --chart-5: #d55181;
  --chart-6: #008300;
  --chart-7: #3987e5;
  --chart-8: #e66767;

  /* Тёмная тема — ступень светлоты поверхности + внутренний верхний блик;
     тени лишь отделяют от холста. */
  --elev-1: 0 1px 2px oklch(0.05 0.01 288 / 0.4);
  --elev-2: 0 1px 2px oklch(0.05 0.01 288 / 0.35), 0 6px 16px -4px oklch(0.05 0.02 288 / 0.5);
  --elev-3: 0 2px 6px oklch(0.05 0.01 288 / 0.4), 0 16px 40px -8px oklch(0.04 0.02 288 / 0.7);
  --elev-4: 0 4px 12px oklch(0.05 0.01 288 / 0.45), 0 32px 80px -12px oklch(0.03 0.02 288 / 0.8);
  --elev-accent: 0 1px 2px oklch(0.1 0.05 var(--brand-h) / 0.5), 0 6px 20px -6px oklch(0.58 0.2 var(--brand-h) / 0.65);
  --highlight-top: inset 0 1px 0 oklch(1 0 0 / 0.055);
  --highlight-accent: inset 0 1px 0 oklch(1 0 0 / 0.2);

  --glow-a: oklch(0.45 0.2 288 / 0.7);
  --glow-b: oklch(0.4 0.17 330 / 0.45);
  --glow-c: oklch(0.42 0.14 250 / 0.45);

  --glass-side: oklch(0.2 0.02 288 / 0.45);
  --glass-sheet: oklch(0.17 0.014 288 / 0.74);
  --glass-edge: oklch(1 0 0 / 0.16);
  --glass-edge-2: oklch(1 0 0 / 0.03);
  --board-col-bg: color-mix(in oklch, var(--bg-sunken) 55%, transparent);
  --board-col-line: var(--border-subtle);
  --board-card-line: var(--border-default);

  --logo: oklch(0.78 0.13 var(--brand-h));
  --ic-l: 0.74;
  --ic-c: 0.13;
}

/* Превью фона «по умолчанию» на плашке выбора — базовое свечение темы (ниже его перекрывают темы). */
[data-atmo="default"] {
  --glow-a: oklch(0.78 0.13 288 / 0.75);
  --glow-b: oklch(0.86 0.1 20 / 0.55);
  --glow-c: oklch(0.86 0.09 220 / 0.55);
}
:root[data-theme="dark"] [data-atmo="default"] {
  --glow-a: oklch(0.45 0.2 288 / 0.7);
  --glow-b: oklch(0.4 0.17 330 / 0.45);
  --glow-c: oklch(0.42 0.14 250 / 0.45);
}

/* ── Курируемые темы (ТЗ 5.14 п.3, theme.ts THEMES). Тема = переопределение семантического слоя поверх базовой
   светлой/тёмной (data-theme) + своё свечение по умолчанию. Акцент в хроме — фиолетовый в любой теме.
   Стоят ПОСЛЕ базовых блоков и ДО фонов: выбранный человеком фон (data-atmosphere) перекрывает свечение темы. */

/* «Сумерки» — тёмная, глубже и фиолетовее базовой. */
:root[data-skin="dusk"] {
  --bg-group: var(--bg-sunken);
  --bg-frame: oklch(0.14 0.03 292);
  --bg-canvas: oklch(0.17 0.032 292);
  --bg-sunken: oklch(0.15 0.03 292);
  --bg-panel: oklch(0.2 0.034 292);
  --bg-raised: oklch(0.226 0.036 292);
  --bg-overlay: oklch(0.216 0.035 292);
  --bg-hover: oklch(0.246 0.04 292);
  --bg-active: oklch(0.28 0.05 292);
  --bg-glass: oklch(0.22 0.036 292 / 0.8);
  --bg-sidebar: oklch(0.14 0.03 292 / 0.5);
  --sidebar-item-active: oklch(0.3 0.06 292 / 0.55);
  --text-2: oklch(0.79 0.02 292);
  --text-3: oklch(0.69 0.026 292);
  --border-subtle: oklch(0.25 0.032 292);
  --border-default: oklch(0.29 0.036 292);
  --border-strong: oklch(0.37 0.04 292);

  :root {
    --border-subtle: var(--border-strong);
    --border-default: var(--border-strong);
    --text-3: var(--text-2);
  }
}

/* ─── 3. Алиасы старых имён (theme.ts до ТЗ 5.4) ─────────────────────────
   Удаляются по одному в PR, где переписан последний экран, их использующий
   (docs/design/ALIASES.md). Новый код пишет семантические имена. */
:root {
  --c-canvas: var(--bg-canvas);
  --c-panel: var(--bg-panel);
  --c-line: var(--border-default);
  --c-linesoft: var(--border-subtle);
  --c-line2: var(--border-strong);

  --c-ink: var(--text-1);
  --c-sub: var(--text-2);
  --c-faint: var(--text-3);

  --c-sidebar: var(--bg-frame);
  --c-sidebar2: var(--bg-hover);

  --c-accent: var(--accent-solid);
  --c-accentdeep: var(--accent-hover);
  --c-accentsoft: var(--accent-subtle);

  --c-ok: var(--status-done);
  --c-oksoft: var(--status-done-bg);
  --c-warn: var(--status-warn);
  --c-warnsoft: var(--status-progress-bg);
  --c-warndot: var(--status-progress);
  --c-danger: var(--status-danger);
  --c-dangersoft: var(--status-danger-bg);
  --c-todo: var(--status-todo);
  --c-todosoft: var(--status-todo-bg);

  --c-ok-fg: var(--status-done-fg);
  --c-warn-fg: var(--status-progress-fg);
  --c-todo-fg: var(--status-todo-fg);

  --c-prio-critical: var(--red-solid);
  --c-prio-high: var(--orange-solid);
  --c-prio-medium: var(--amber-solid);
  --c-prio-low: var(--gray-9);
}

/* Формулы вычисляются на носителе цвета проекта, а не на :root. */
.rm-row, .roadmap-legend i {
  --roadmap-fill: linear-gradient(90deg, oklch(from var(--bar) var(--roadmap-fill-start-l) 0.17 h), oklch(from var(--bar) var(--roadmap-fill-end-l) 0.14 calc(h + 20)));
  --roadmap-rest: linear-gradient(90deg, color-mix(in oklch, var(--bar) 32%, transparent), color-mix(in oklch, var(--bar) 4%, transparent));
  --roadmap-edge: color-mix(in oklch, var(--bar) 55%, transparent);
  --roadmap-shadow: drop-shadow(0 6px 10px color-mix(in oklch, var(--bar) 30%, transparent));
}

/* Additional brand presets use a slightly darker solid so white labels keep WCAG AA in every theme. */
:root[data-brand-palette="extended"] {
  --accent-solid: oklch(0.505 0.16 var(--brand-h));
  --accent-hover: oklch(0.475 0.16 var(--brand-h));
}

:root[data-brand-palette="warm"] {
  --accent-solid: oklch(0.55 0.16 var(--brand-h));
  --accent-hover: oklch(0.52 0.16 var(--brand-h));
}

--status-danger-fg);background:var(--bg-panel);margin-bottom:18px}.metrics{display:flex;gap:45px;margin:22px 0}.metric strong{display:block;font-size:28px;letter-spacing:-.8px}.metric small{color:var(--text-2)}.chart{width:100%;height:230px;overflow:visible}.chart text{fill:var(--text-2);font-size:12px}.chart .band{fill:var(--accent-subtle)}.chart .line{fill:none;stroke:var(--accent-text);stroke-width:3}.chart .axis{stroke:var(--border-default)}.meter{height:6px;border-radius:4px;background:var(--border-default);margin:8px 0}.meter div{height:6px;background:var(--accent-text);width:62%;border-radius:4px}.toast{position:fixed;bottom:24px;right:24px;padding:13px 20px;border:1px solid var(--border-default);background:var(--bg-panel);box-shadow:0 6px 30px #0002;border-radius:8px;z-index:5;max-width:430px}dialog{color:var(--text-1);background:var(--bg-panel);border:1px solid var(--border-default);border-radius:12px;padding:25px;width:min(580px,90vw)}dialog::backdrop{background:#10182880}dialog .actions{justify-content:flex-end;margin-top:22px}.scenario-progress{margin-bottom:22px;font-size:12px;color:var(--text-2)}.scenario-progress button{margin-left:12px}.empty{text-align:center;padding:45px}.narrow .shell{max-width:760px;margin:auto;grid-template-columns:1fr}.narrow .rail{display:none}.narrow .grid,.narrow .three{grid-template-columns:1fr}.narrow main{padding:20px}.narrow .toolbar{padding:12px 20px}@media(max-width:850px){.shell{grid-template-columns:1fr}.rail{padding:12px;border-right:0;border-bottom:1px solid var(--border-default)}.logo{display:none}.project,.rail small{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.grid,.three{grid-template-columns:1fr}.toolbar,main{padding:18px}.heading{align-items:flex-start;flex-direction:column}.metrics{gap:22px}.parallel{grid-template-columns:1fr}}

<div class="shell"><aside class="rail"><div class="logo">taskira<span style="color:var(--accent-text)">.</span></div><div class="project">РАБОЧЕЕ ПРОСТРАНСТВО / CORP</div><nav id="nav"></nav><small>Самостоятельный референс<br>Демонстрационные данные<br>Все модули включены</small></aside><div class="body"><header class="toolbar"><span>Taskira · развитие рабочего пространства</span><select id="scenario" aria-label="Сценарий"><option value="audit">Проверка системы</option><option value="policy">Подготовка регламента</option><option value="service">Запуск сервиса</option></select><button id="theme">Тёмная тема</button><button id="narrow">Узкий экран</button><select id="state" aria-label="Состояние"><option value="normal">Обычный режим</option><option value="offline">Потеря связи</option><option value="error">Ошибка сохранения</option><option value="empty">Пустой раздел</option><option value="readonly">Только чтение</option></select></header><main id="main"></main></div></div>
<dialog id="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="actions"><button id="cancel">Отмена</button><button id="confirm" class="primary">Подтвердить</button></div></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=id=>document.getElementById(id);
const scenarios={audit:{name:'Проверка системы',object:'Корпоративный портал',doc:'Инструкция проверки портала',result:'Результаты проверки · ноябрь',process:'Плановая проверка',steps:['Провести проверку','Устранить замечания','Повторная проверка','Подтвердить результат'],task:'Отключить устаревший протокол',purpose:'Проверить настройки доступа, зафиксировать замечания и подтвердить их устранение.',outcome:'Выполненная проверка с подтверждениями и перечнем устранённых замечаний.'},policy:{name:'Подготовка регламента',object:'Управление доступом',doc:'Регламент предоставления доступа',result:'План внедрения регламента',process:'Подготовка и внедрение',steps:['Подготовить регламент','Согласовать документ','Внедрить изменения','Подтвердить итоговую версию'],task:'Обновить настройки согласования',purpose:'Описать порядок работы и выполнить мероприятия по внедрению.',outcome:'Актуальный регламент с историей обсуждения и подтверждённым внедрением.'},service:{name:'Запуск сервиса',object:'Новый внутренний сервис',doc:'Требования к сервису',result:'Порядок эксплуатации',process:'Запуск сервиса',steps:['Подготовить инфраструктуру','Настроить сервис','Проверить готовность','Подтвердить запуск'],task:'Настроить резервное копирование',purpose:'Подготовить инфраструктуру и документацию, проверить готовность к эксплуатации.',outcome:'Сервис с подтверждённой готовностью и собранной эксплуатационной документацией.'}};
const sections=[['library','Библиотека'],['documents','Документы'],['versions','Версии и комментарии'],['objects','Объекты'],['processes','Процессы'],['run','Выполнение процесса'],['planning','Планирование'],['files','Файлы']];
let section='library',scenario='audit',step=0,runStage=0,createdTask=false,verified=true,whatif=false,commentClosed=false,version=3,scenarioSaved=false,versionPinned=3,modalAction=null;
const current=()=>scenarios[scenario];
const button=(text,action,primary=false)=>`<button ${primary?'class="primary"':''} data-action="${action}">${text}</button>`;
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3500)}
function modal(title,body,action){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=body;modalAction=action;$('dialog').showModal()}
function heading(title,sub,actions=''){return `<div class="heading"><div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="actions">${actions}</div></div>`}
function link(title,target,sub){return `<div class="row"><div><button class="link" data-view="${target}">${title}</button><small>${sub}</small></div><span class="muted">↗</span></div>`}
function render(){const s=current(),state=$('state').value;document.title=s.name+' · Taskira';$('nav').innerHTML=sections.map(([id,label])=>`<button data-view="${id}" ${section===id?'aria-current="page"':''}>${label}</button>`).join('');let html=`<div class="scenario-progress">Сценарий: ${s.name} · шаг ${step+1} из 7 ${button('Следующий шаг →','next')}</div>`;if(state==='offline')html+='<div class="alert" role="status">Соединение потеряно. Правки остаются в этой вкладке и синхронизируются после восстановления связи. '+button('Восстановить связь','reconnect')+'</div>';if(state==='error')html+='<div class="alert" role="alert">Не удалось подтвердить запись в базе данных. Документ ещё не сохранён. '+button('Повторить сохранение','reconnect')+'</div>';if(state==='readonly')html+='<div class="alert">Модуль выключен для проекта. Материалы доступны для чтения и экспорта.</div>';if(state==='empty')html+=`<div class="panel empty"><h1>Здесь появятся материалы проекта</h1><p class="muted">Начните с документа, объекта или шаблона процесса.</p>${button('Создать первый документ','first',true)}</div>`;else html+=views[section](s);$('main').innerHTML=html;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{section=b.dataset.view;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));const edit=$('editor');if(edit){edit.contentEditable=String(state!=='readonly');edit.oninput=()=>{verified=false;$('save').textContent=state==='normal'?'Сохранено · совместная работа':'Изменения в этой вкладке';$('verification').textContent='Изменён после подтверждения'}}if($('query'))$('query').oninput=e=>document.querySelectorAll('.material').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(e.target.value.toLowerCase()));if($('whatif'))$('whatif').onchange=e=>{whatif=e.target.checked;render()}}
const views={
files:s=>heading('Файлы проекта','Все вложения задач и документов проекта CORP')+`<div class="panel scroll"><label>Поиск файлов<input id="filequery" placeholder="Имя файла, задача или документ"></label><table><thead><tr><th>Файл</th><th>Где используется</th><th>Размер</th><th>Загрузил</th><th>Действие</th></tr></thead><tbody id="filerows"><tr><td>portal-check-protocol.txt</td><td>${link(s.steps[0],'run','Задача CORP-40')}</td><td>2 КБ</td><td>Михаил Иванов</td><td>${button('Скачать протокол','downloadfile')}</td></tr><tr><td>portal-check-results.txt</td><td>${link(s.result,'documents','Документ результата')}</td><td>3 КБ</td><td>Анна Смирнова</td><td>${button('Скачать результат','downloadfile')}</td></tr><tr><td>previous-check.txt</td><td>${link(s.doc,'documents','Архивный документ')}</td><td>1 КБ</td><td>Анна Смирнова</td><td>${button('Скачать прошлую проверку','downloadfile')}</td></tr></tbody></table><p class="muted">Файл хранится в исходной задаче или документе. Архивирование сохраняет доступ к вложениям.</p></div>`,
library:s=>heading('Библиотека','Материалы из доступных вам проектов',button('Новый документ','newdoc',true))+`<div class="tabs"><button class="active">Все материалы</button><button data-view="documents">Документы</button><button data-view="objects">Объекты</button><button data-view="run">Запуски</button></div><input id="query" aria-label="Поиск материалов" placeholder="Поиск по названию и содержимому"><div class="grid" style="margin-top:20px"><section class="panel"><div class="material">${link(s.doc,'documents','Документ · CORP · версия '+version)}</div><div class="material">${link(s.object,'objects','Система · ответственный Анна Смирнова')}</div><div class="material">${link(s.process,'run','Процесс · '+(runStage===4?'завершён':'выполняется'))}</div><div class="material">${link(s.result,'documents','Документ результата · обновлён сегодня')}</div></section><aside class="panel"><h2>Работа и её контекст</h2><p>${s.purpose}</p><span class="badge">Доступ унаследован от проекта</span><p class="muted">Отдельное приглашение к задаче не открывает документы и объекты проекта.</p></aside></div>`,
documents:s=>heading(s.doc,'Документы проекта / CORP',button('Создать задачу из текста','task')+button('Подтвердить версию','verify',true))+`<div class="grid"><section class="panel"><div class="row"><span>Ответственная: Анна Смирнова</span><span class="badge" id="verification">${verified?'Актуален до 10.02.2027':'Изменён после подтверждения'}</span></div><div class="row"><span class="muted" id="save">Сохранено · совместная работа</span><span title="Демонстрационные участники">АС · МИ · 2 участника</span></div><div class="document" id="editor" role="textbox" aria-label="Текст документа" aria-multiline="true"><h2>Назначение</h2><p>${s.purpose}</p><h2>Порядок выполнения</h2><ol><li>Проверить исходные сведения об объекте.</li><li>Выполнить действия и зафиксировать результат.</li><li>${s.task}.</li></ol><h2>Ожидаемый результат</h2><p>${s.outcome}</p></div>${createdTask?'<span class="badge">CORP-42 · В работе · ссылка на исходный раздел</span>':''}<div class="actions">${button('Скачать документ','export')}${button('Комментарии и версии','versions')}</div></section><aside class="panel"><h2>Дерево документов</h2>${link(s.doc,'documents','Основной документ')}${link(s.result,'documents','Результат работы')}<h2 style="margin-top:24px">Связанные материалы</h2>${link(s.object,'objects','Объект')}${link(s.process,'run','Процесс, инструкция v'+versionPinned)}<p class="muted">Выделите пункт и создайте поручение. Отправка формы выполняется явно.</p></aside></div>`,
versions:s=>heading('Комментарии и версии',s.doc,button('Создать контрольную версию','checkpoint',true))+`<div class="grid"><section class="panel"><h2>Обсуждение раздела «Порядок выполнения»</h2><div class="comment"><small>Михаил Иванов · сегодня, 10:42</small><p>Нужно приложить подтверждение результата перед завершением этапа.</p><span class="badge">${commentClosed?'Обсуждение закрыто':'Открыто'}</span></div><label>Ваш ответ<textarea id="reply" rows="3" placeholder="Уточните предложение"></textarea></label><div class="actions">${button('Ответить','reply')}${button(commentClosed?'Открыть обсуждение':'Закрыть обсуждение','resolve')}</div></section><aside class="panel"><h2>История документа</h2><div class="row"><div><strong>Версия ${version}</strong><small>Текущая · сохранена сегодня</small></div>${button('Подтвердить','verify')}</div><div class="row"><div><strong>Версия 2 · согласованная</strong><small>Анна Смирнова · 09.11.2026</small></div>${button('Восстановить','restore')}</div><p class="muted">Восстановление создаёт новую редакцию. Открытые редакторы переподключаются; прошлые версии сохраняются.</p><span class="badge">Подтверждение относится к версии ${verified?version:2}</span></aside></div>`,
objects:s=>heading('Реестр систем','Объекты проекта / 3 записи',button('Настроить поля','fields')+button('Создать объект','newobject',true))+`<div class="actions" style="margin-bottom:18px">${button('Открыть карточку','objectdetail',true)}${button('Без ответственного','filter')}<span class="badge">Колонки: название, владелец, состояние, задачи</span></div><div class="panel scroll"><table><thead><tr><th>Название</th><th>Ответственный</th><th>Состояние</th><th>Открытые задачи</th><th>Проверка</th></tr></thead><tbody><tr><td><button data-action="objectdetail">${s.object}</button></td><td>Анна Смирнова</td><td><span class="badge">В эксплуатации</span></td><td>${createdTask?4:3}</td><td>10.11.2026</td></tr><tr><td>Почтовый сервис</td><td>Михаил Иванов</td><td>В эксплуатации</td><td>2</td><td>05.11.2026</td></tr><tr><td>Архивная система</td><td>Не назначен</td><td>Архив</td><td>0</td><td>12.08.2026</td></tr></tbody></table></div><div class="grid" style="margin-top:20px"><section class="panel"><h2>${s.object}</h2><div class="tabs"><button data-action="objecttasks">Задачи</button><button data-view="documents">Документы</button><button data-view="run">Процессы</button><button data-action="objecthistory">История</button></div>${link(s.doc,'documents','Инструкция · версия '+version)}${link(s.result,'documents','Результат предыдущей работы')}${link(s.process,'run','Текущий запуск')}</section><aside class="panel"><h2>Свойства объекта</h2><p>Ответственная: Анна Смирнова<br>Адрес: portal.corp.local<br>Следующая проверка: 10.02.2027</p><div class="actions">${button('Создать задачу','task')}${button('Архивировать','archive')}</div></aside></div>`,
processes:s=>heading(s.process,'Конструктор процесса · опубликована версия 1',button('Предпросмотр','preview')+button('Опубликовать новую версию','publish')+button('Запустить','start',true))+`<div class="grid"><section class="panel"><div class="flow"><div class="step"><strong>1. ${s.steps[0]}</strong><small>Инструкция v${version} · средняя сложность · срок +3 дня</small></div><div class="parallel"><div class="step"><strong>2. ${s.steps[1]}</strong><small>После этапа 1 · при наличии замечаний</small></div><div class="step"><strong>Документировать результат</strong><small>После этапа 1 · параллельно</small></div></div><div class="step"><strong>3. ${s.steps[2]}</strong><small>После завершения предыдущих этапов</small></div><div class="step"><strong>4. ${s.steps[3]}</strong><small>Обязательная проверка · Анна Смирнова</small></div></div></section><aside class="panel"><h2>Настройки этапа</h2><label>Название<input value="${s.steps[1]}"></label><label>Срок от открытия этапа<select><option>3 дня</option><option>7 дней</option></select></label><label>Сложность<select><option>Средняя</option><option>Простая</option><option>Высокая</option></select></label><label>Условие<input value="Есть замечания = Да"></label><p class="muted">Граф без циклов. Действующие запуски продолжают использовать свою опубликованную версию.</p>${button('Сохранить черновик','draft')}<hr><h3>Правило автоматизации</h3><p class="muted">Статус → Проверка → уведомить проверяющего.</p>${button('Проверить на примере','rule')}</aside></div>`,
run:s=>heading(s.process,`${s.object} · инструкция v${versionPinned}`,button('Добавить в план','plan',true)+button('Пауза','pause')+button('Отменить запуск','cancelrun'))+`<div class="grid"><section class="panel"><div class="row"><strong>${runStage===4?'Процесс завершён':'Выполняется'}</strong><span class="badge">Версия процесса 1</span></div><div class="flow">${s.steps.map((title,i)=>`<div class="step ${i===runStage?'active':''}"><strong>${i+1}. ${title}</strong><small>${i<runStage?'Завершён · результат сохранён':i===runStage?'Задача CORP-'+(40+i)+' · '+(i===3?'ожидает подтверждения':'в работе'):'Ожидает предшественников · задача ещё не создана'}</small></div>`).join('')}</div><div class="actions" style="margin-top:22px">${runStage<3?button('Завершить текущий этап','complete',true):runStage===3?button('Подтвердить результат','approve',true):'<span class="badge">Готовность подтверждена</span>'}${runStage===3?button('Вернуть на доработку','return'):''}</div></section><aside class="panel"><h2>Журнал выполнения</h2><div class="row"><div>Запуск подтверждён<small>Анна Смирнова · 10:05</small></div></div><div class="row"><div>Создана задача первого этапа<small>Ключ выполнения сохранён</small></div></div>${runStage>0?'<div class="row"><div>Результат этапа сохранён<small>Следующий этап открыт</small></div></div>':''}<p class="muted">Повторная доставка события не создаёт ещё одну задачу.</p>${link(s.result,'documents','Совместный документ результата')}</aside></div>`,
planning:s=>heading('План работ · ноябрь','Прогноз по сложности и истории выполнения',button('Сохранить сценарий','scenario',true))+`<div class="tabs"><button class="active">Основной план</button><button data-action="urgent">Со срочной работой</button><span class="muted">Целевая дата: 30.11.2026</span></div><div class="grid"><section class="panel"><h2>${whatif?'Сценарий со срочной работой':'Основной сценарий'}</h2><label><span><input type="checkbox" id="whatif" ${whatif?'checked':''}> Добавить 3 срочные задачи высокой сложности</span></label><div class="metrics"><div class="metric"><strong>${whatif?'7 декабря':'23 ноября'}</strong><small>Медианная неделя</small></div><div class="metric"><strong>${whatif?'21 декабря':'7 декабря'}</strong><small>80-й процентиль</small></div></div><svg class="chart" viewBox="0 0 650 230" role="img" aria-label="Накопленный объём завершённой работы и диапазон прогноза"><path class="axis" d="M30 10V195H625"/><path class="band" d="M250 148L600 22V${whatif?150:100}L250 148Z"/><path class="line" d="M30 184L85 180L140 164L195 155L250 148L330 125L410 92L510 60L600 22"/><text x="30" y="220">Октябрь</text><text x="230" y="220">Ноябрь</text><text x="470" y="220">Декабрь</text><text x="350" y="165">Диапазон расчётных исходов</text></svg><h3>Состав и приоритеты</h3><div class="row"><span>${s.task}</span><span>Высокая</span></div><div class="row"><span>${s.steps[2]} · будущий этап</span><span>Средняя</span></div><div class="row"><span>${s.steps[3]} · зависит от проверки</span><span>Простая</span></div>${whatif?'<div class="row"><span>Срочная работа · 3 задачи</span><span>Высокая</span></div>':''}</section><aside class="panel"><h2>Качество исходных данных</h2><span class="badge">Истории достаточно</span><p>12 полных недель<br>58 завершённых задач<br>10 000 повторных выборок</p><p class="muted">Учёт часов не используется. Диапазон является оценкой по прошлой скорости, а не обязательством по сроку.</p>${button('Показать недостаточную историю','insufficient')}<h2 style="margin-top:25px">Нагрузка</h2><strong>Анна Смирнова · 6 задач</strong><div class="meter"><div></div></div><small class="muted">2 высокие · 3 средние · 1 простая</small><p class="muted">Этап и созданная из него задача учитываются один раз. Сценарий не меняет реальные сроки и исполнителей.</p></aside></div>`
};
function action(a){const s=current();if(a==='next'){step=(step+1)%7;section=['objects','processes','documents','versions','planning','run','library'][step];render();return}if(a==='reconnect'||a==='first'){$('state').value='normal';if(a==='first')section='documents';render();return}if(a==='newdoc'){modal('Создать документ','<label>Название<input id="newname" value="'+s.result+'"></label><label>Шаблон<select><option>Регламент</option><option>Инструкция</option><option>Протокол</option></select></label>',()=>{section='documents';toast('Документ создан в проекте CORP');render()});return}if(a==='task'){modal('Создать задачу из документа',`<label>Название<input value="${s.task}"></label><p class="muted">Будут сохранены ссылки на документ, исходный раздел и объект «${s.object}».</p>`,()=>{createdTask=true;toast('Создана CORP-42. В документ добавлена ссылка со статусом.');render()});return}if(a==='verify'){modal('Подтвердить конкретную версию',`<p>Версия ${version} · ${s.doc}</p><label>Актуальна до<input type="date" value="2027-02-10"></label>`,()=>{verified=true;toast('Подтверждение привязано к версии '+version);render()});return}if(a==='versions'){section='versions';render();return}if(a==='checkpoint'){version++;toast('Создана контрольная версия '+version);render();return}if(a==='restore'){modal('Восстановить версию 2','<p>Будет создана новая редакция. Участники переподключатся к восстановленному документу.</p>',()=>{version++;verified=false;toast('Создана версия '+version+' из версии 2');section='documents';render()});return}if(a==='resolve'){commentClosed=!commentClosed;render();return}if(a==='reply'){const text=$('reply').value;if(text.trim()){commentClosed=false;toast('Ответ сохранён');$('reply').value=''}return}if(a==='export'){const blob=new Blob([JSON.stringify({title:s.doc,version,text:$('editor').innerText},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='taskira-document.json';link.click();URL.revokeObjectURL(url);return}if(a==='fields'){modal('Структура реестра','<p>Типы полей: текст, число, дата, список, флажок, пользователь и ссылка на объект этого проекта.</p><label>Название поля<input value="Следующая проверка"></label><label>Тип<select><option>Дата</option><option>Пользователь</option><option>Ссылка на объект</option></select></label>',()=>toast('Структура реестра сохранена'));return}if(a==='newobject'||a==='objectdetail'){modal(a==='newobject'?'Создать объект':s.object,'<label>Название<input value="'+s.object+'"></label><label>Ответственный<select><option>Анна Смирнова</option><option>Михаил Иванов</option></select></label><p>Документы, задачи, процессы и история доступны во вкладках карточки.</p>',()=>toast('Свойства сохранены с проверкой версии записи'));return}if(a==='filter'){toast('Найдена 1 система без ответственного: Архивная система');return}if(a==='objecttasks'){modal('Задачи объекта',`<p>CORP-42 · ${s.task} · В работе</p><p>CORP-39 · Подготовить сведения · Завершено</p>`,()=>{section='planning';render()});return}if(a==='objecthistory'){modal('История объекта','<p>10.11 · связана инструкция</p><p>09.11 · назначена ответственная</p><p>05.11 · завершена предыдущая проверка</p>',()=>{});return}if(a==='archive'){modal('Архивировать объект','<p>История и ссылки сохранятся. Запись останется доступна через фильтр архива.</p>',()=>toast('Объект помещён в архив'));return}if(a==='start'){modal('Проверить параметры запуска',`<p>${s.process} · опубликованная версия 1</p><p>Объект: ${s.object}<br>Инструкция: версия ${version}<br>Исполнители: Анна Смирнова, Михаил Иванов</p><p class="muted">Первый этап создаст задачу сразу. Остальные ожидают своих предшественников.</p>`,()=>{runStage=0;versionPinned=version;section='run';toast('Процесс запущен');render()});return}if(a==='preview'){modal('Предварительный список работы','<ol>'+s.steps.map(x=>'<li>'+x+'</li>').join('')+'</ol><p>Ошибок графа не обнаружено.</p>',()=>{});return}if(a==='publish'){modal('Опубликовать новую версию','<p>Текущие запуски продолжат работу по версии 1. Новые получат новую версию.</p>',()=>toast('Новая версия опубликована'));return}if(a==='draft'){toast('Черновик сохранён; опубликованная версия не изменена');return}if(a==='rule'){modal('Предпросмотр автоматизации','<p>Событие: статус задачи изменён на «Проверка».</p><p>Действие: уведомить Анну Смирнову.</p><p class="muted">Предпросмотр не выполняет действие.</p>',()=>toast('Правило включено'));return}if(a==='complete'){runStage++;toast('Этап завершён; зависимая работа открыта');render();return}if(a==='approve'){runStage=4;toast(s.outcome);render();return}if(a==='return'){toast('Этап остаётся открытым; задача возвращена на разрешённый статус доработки');return}if(a==='pause'){modal('Приостановить процесс','<p>Следующие этапы не запустятся. Сроки уже созданных задач сохранятся.</p>',()=>toast('Процесс на паузе. Его можно возобновить.'));return}if(a==='cancelrun'){modal('Отменить запуск','<p>Новые задачи больше не будут создаваться. История запуска сохранится.</p>',()=>toast('Запуск отменён'));return}if(a==='plan'){section='planning';toast('Добавлены задачи и будущие этапы без повторного учёта');render();return}if(a==='urgent'){whatif=true;render();return}if(a==='scenario'){scenarioSaved=true;toast('Сценарий сохранён отдельно. Фактические задачи не изменились.');return}if(a==='insufficient'){modal('Истории пока недостаточно','<p>Доступны 3 полные недели и 14 завершённых задач. Минимум: 4 недели и 20 задач, с историей каждой категории сложности плана.</p><p><strong>Дата прогноза не рассчитывается.</strong> Состав работы и фактические показатели остаются доступны.</p>',()=>{});return}}
$('cancel').onclick=()=>$('dialog').close();$('confirm').onclick=()=>{$('dialog').close();modalAction?.()};$('scenario').onchange=e=>{scenario=e.target.value;step=0;runStage=0;createdTask=false;section='objects';render()};$('state').onchange=render;$('theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').textContent=dark?'Светлая тема':'Тёмная тема'};$('narrow').onclick=()=>{document.body.classList.toggle('narrow');$('narrow').textContent=document.body.classList.contains('narrow')?'Широкий экран':'Узкий экран'};render();
document.addEventListener('input',event=>{if(event.target.id==='filequery'){const query=event.target.value.toLocaleLowerCase();document.querySelectorAll('#filerows tr').forEach(row=>row.hidden=!row.textContent.toLocaleLowerCase().includes(query))}});
document.addEventListener('click',event=>{const target=event.target.closest('[data-action="downloadfile"]');if(!target)return;const row=target.closest('tr'),filename=row.querySelector('td').textContent,url=URL.createObjectURL(new Blob(['Демонстрационный файл Taskira\n'+current().object+'\n'+current().outcome],{type:'text/plain;charset=utf-8'})),anchor=document.createElement('a');anchor.href=url;anchor.download=filename;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
</script>

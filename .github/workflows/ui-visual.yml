name: ui visual

# Визуальная регрессия и axe библиотеки компонентов (ТЗ 5.7 п. 6, ADR-0014): только на PR,
# затрагивающих компоненты, — минуты CI платные. Эталоны: e2e/__screenshots__ (Linux Chromium
# из @playwright/test 1.56.1); обновить — `npm run test:ui -- --update-snapshots` в той же среде.
on:
  pull_request:
    paths:
      - "src/ds/**"
      - "src/components/**"
      - "src/dashboards/widgets.tsx"
      - "src/dev/**"
      - "src/styles/tokens.css"
      - "e2e/**"
      - "playwright.config.ts"

jobs:
  ui-visual:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-diff
          path: test-results/
          retention-days: 7

name: ui visual

# Визуальная регрессия и axe библиотеки компонентов (ТЗ 5.7 п. 6, ADR-0014): только на PR,
# затрагивающих продуктовый UI, публичные ресурсы или зависимости. Эталоны: e2e/__screenshots__ (Linux Chromium
# из @playwright/test 1.56.1); обновить — `npm run test:ui -- --update-snapshots` в той же среде.
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "tsconfig.json"
      - ".github/workflows/ui-visual.yml"
      - "e2e/**"
      - "playwright.config.ts"
      - "playwright.production.config.ts"
      - "scripts/preview-production.mjs"
      - "nginx.conf"

jobs:
  ui-visual:
    runs-on: [self-hosted, Linux]
    # Match the pinned Playwright version and the Linux screenshot environment.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      volumes:
        - /etc/ssl/certs/ca-certificates.crt:/opt/taskira-runner-ca.pem:ro
    env:
      NODE_EXTRA_CA_CERTS: /opt/taskira-runner-ca.pem
      NODE_USE_SYSTEM_CA: '1'
      SSL_CERT_FILE: /opt/taskira-runner-ca.pem
      CURL_CA_BUNDLE: /opt/taskira-runner-ca.pem
      GIT_SSL_CAINFO: /opt/taskira-runner-ca.pem
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ui
      - run: npm run test:ui:production
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-diff
          path: test-results/
          retention-days: 7

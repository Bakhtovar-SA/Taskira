name: ui visual

# Визуальная регрессия и axe библиотеки компонентов (ТЗ 5.7 п. 6, ADR-0014): только на PR,
# затрагивающих продуктовый UI, публичные ресурсы или зависимости. Эталоны: e2e/__screenshots__ (Linux Chromium
# из закреплённой версии @playwright/test); обновить — `npm run test:ui -- --update-snapshots` в той же среде.
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "tsconfig.json"
      - ".github/workflows/ui-visual.yml"
      - ".github/scripts/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "playwright.production.config.ts"
      - "scripts/preview-production.mjs"
      - "nginx.conf"

jobs:
  ui-visual:
    runs-on: ubuntu-24.04
    # Match the pinned Playwright version and the Linux screenshot environment.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Playwright driver and browser image versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const driver = require('@playwright/test/package.json').version;
          const image = JSON.parse(fs.readFileSync('/ms-playwright/.docker-info', 'utf8'));
          if (driver !== image.driverVersion) {
            throw new Error(`Playwright driver ${driver} does not match browser image ${image.driverVersion}`);
          }
          console.log(`Playwright ${driver}: driver and image match`);
          NODE
      - run: npm run test:ui
      - run: npm run test:ui:production
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-diff
          path: |
            test-results/
            e2e/__screenshots__/issue-*-linux.png
          retention-days: 7

name: runner readiness

on:
  workflow_dispatch:

jobs:
  docker:
    name: Docker readiness (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            label: taskira-a
          - name: ubuntu
            label: taskira-b
    runs-on: [self-hosted, Linux, "${{ matrix.label }}"]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check account, paths and Docker socket access
        run: |
          id
          printf 'Workspace: %s\nTool cache: %s\n' "$GITHUB_WORKSPACE" "$RUNNER_TOOL_CACHE"
          docker context show
          if [ -e /var/run/docker.sock ]; then stat -Lc 'Docker socket: %U %G %a' /var/run/docker.sock; fi
          timeout 30 docker version
          timeout 30 docker info --format 'Daemon ID={{.ID}}; version={{.ServerVersion}}; OS={{.OSType}}'
      - name: Inspect tools required by the test jobs
        run: |
          cat /etc/os-release
          for tool in jq psql pg_dump pg_restore python3 unzip zip curl git openssl ip; do
            if command -v "$tool" >/dev/null; then
              printf '%s: %s\n' "$tool" "$(command -v "$tool")"
            else
              printf '%s: missing\n' "$tool"
            fi
          done
          docker compose version
          if command -v pg_restore >/dev/null; then pg_restore --version; fi
      - uses: actions/checkout@v7
      - name: Prepare trusted CA bundle on this host
        run: bash .github/scripts/prepare-runner-trust.sh
      - name: Verify container mounts, TLS and Git
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$RUNNER_TOOL_CACHE,dst=/__w/_tool,readonly" \
            --workdir /workspace \
            -e GITHUB_WORKSPACE=/workspace \
            -e NODE_EXTRA_CA_CERTS=/__w/_tool/taskira-trust/ca-certificates.crt \
            node:22-bookworm sh -c 'node .github/scripts/check-runner-tls.mjs && node .github/scripts/check-runner-repository.mjs'

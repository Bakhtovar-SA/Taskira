name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  prepare-runner-trust:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: [self-hosted, Linux, docker]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Prepare checkout ownership
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          # Container actions can leave root-owned Git files on a persistent runner.
          # Repair only this checkout; never follow symlinks outside its bind mount.
          owner="$(id -u):$(id -g)"
          docker run --rm --network none --read-only --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            node:22-bookworm chown -hRP --from=0 -- "$owner" /workspace
      - uses: actions/checkout@v7
      - name: Prepare local Linux and WSL CA bundle
        run: bash .github/scripts/prepare-runner-trust.sh
  claude:
    needs: prepare-runner-trust
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: [self-hosted, Linux, docker]
    container:
      image: node:22-bookworm
    env:
      NODE_EXTRA_CA_CERTS: /__w/_tool/taskira-trust/ca-certificates.crt
      NODE_USE_SYSTEM_CA: '1'
      SSL_CERT_FILE: /__w/_tool/taskira-trust/ca-certificates.crt
      CURL_CA_BUNDLE: /__w/_tool/taskira-trust/ca-certificates.crt
      GIT_SSL_CAINFO: /__w/_tool/taskira-trust/ca-certificates.crt
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Install review tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends unzip gh ripgrep
      - name: Install pinned Bun runtime
        working-directory: /tmp
        run: npm install --global bun@1.3.14
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify TLS in both action runtimes
        run: |
          node .github/scripts/check-runner-tls.mjs
          bun .github/scripts/check-runner-tls.mjs

      - name: Verify repository in both action runtimes
        run: |
          node .github/scripts/check-runner-repository.mjs
          bun .github/scripts/check-runner-repository.mjs

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: /usr/local/bin/bun

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'


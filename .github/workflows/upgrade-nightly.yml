name: upgrade-nightly

# OPS-UPG-01: nightly "upgrade from the latest release (N-1)" on main, independent of
# which paths a PR touched. OLD_REF defaults to the latest vX.Y.Z tag; run it by hand
# with an explicit ref via workflow_dispatch.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      old_ref:
        description: "Git ref to upgrade from (default: latest vX.Y.Z tag)"
        required: false
        default: ""

jobs:
  upgrade-from-latest-release:
    name: offline upgrade and rollback (from latest release)
    runs-on: [self-hosted, Linux, docker]
    concurrency:
      group: taskira-image-integration
      queue: max
      cancel-in-progress: false
    steps:
      - name: Prepare checkout ownership
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          # Container actions can leave root-owned Git files on a persistent runner.
          # Repair only this checkout; never follow symlinks outside its bind mount.
          owner="$(id -u):$(id -g)"
          docker run --rm --network none --read-only --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            node:22-bookworm chown -hRP --from=0 -- "$owner" /workspace
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/prepare-test-runner
      - name: Build versioned images, upgrade from the latest release tag, and roll back
        env:
          OLD_REF: ${{ inputs.old_ref }}
        run: bash scripts/test-upgrade-integration.sh

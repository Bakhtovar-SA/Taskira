name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  prepare-runner-trust:
    runs-on: [self-hosted, Linux, docker]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Prepare checkout ownership
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          # Container actions can leave root-owned Git files on a persistent runner.
          # Repair only this checkout; never follow symlinks outside its bind mount.
          owner="$(id -u):$(id -g)"
          docker run --rm --network none --read-only --cap-drop ALL \
            --cap-add CHOWN --cap-add DAC_OVERRIDE --security-opt no-new-privileges \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            node:22-bookworm chown -hRP --from=0 -- "$owner" /workspace
      - uses: actions/checkout@v7
      - name: Prepare local Linux and WSL CA bundle
        run: bash .github/scripts/prepare-runner-trust.sh
  claude-review:
    needs: prepare-runner-trust
    runs-on: [self-hosted, Linux, docker]
    container:
      image: node:22-bookworm
      # GitHub already mounts the host tool cache at /__w/_tool in this container.
    env:
      NODE_EXTRA_CA_CERTS: /__w/_tool/taskira-trust/ca-certificates.crt
      NODE_USE_SYSTEM_CA: '1'
      SSL_CERT_FILE: /__w/_tool/taskira-trust/ca-certificates.crt
      CURL_CA_BUNDLE: /__w/_tool/taskira-trust/ca-certificates.crt
      GIT_SSL_CAINFO: /__w/_tool/taskira-trust/ca-certificates.crt
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Install review tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends unzip gh ripgrep
      - name: Install pinned Bun runtime
        working-directory: /tmp
        run: npm install --global bun@1.3.14
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify TLS in both action runtimes
        run: |
          node .github/scripts/check-runner-tls.mjs
          bun .github/scripts/check-runner-tls.mjs

      - name: Verify repository in both action runtimes
        run: |
          node .github/scripts/check-runner-repository.mjs
          bun .github/scripts/check-runner-repository.mjs

      - name: Automated PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: /usr/local/bin/bun
          allowed_bots: dependabot
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the conventions in CLAUDE.md and
            server/README.md. Focus on:
            - correctness bugs and regressions
            - the permission matrix staying in sync between src/permissions.ts and
              server/src/permissions.ts, and LIMITS between src/validation.ts and
              server/src/contract.ts
            - security of API mutations (server-side re-checks, zod validation)
            - TypeScript soundness (client `npm run typecheck`, server `npm run typecheck`)

            Leave inline comments on specific lines where relevant. Keep the summary
            concise and actionable. Do not approve or request changes formally —
            just comment.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: [self-hosted, Linux]
    container: node:22-bookworm
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Install review tools
        run: apt-get update -qq && apt-get install -y --no-install-recommends unzip gh ripgrep
      - name: Install pinned Bun runtime
        working-directory: /tmp
        run: npm install --global bun@1.3.14
      - name: Check GitHub TLS trust
        run: |
          host=$(node -p 'new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL).hostname')
          openssl s_client -connect "$host:443" -servername "$host" </dev/null 2>/dev/null |
            openssl x509 -noout -subject -issuer -fingerprint -sha256
          curl --silent --show-error --head --max-time 20 "https://$host/" >/dev/null
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Automated PR review
        uses: anthropics/claude-code-action@v1
        env:
          NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
          NODE_USE_SYSTEM_CA: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_bun_executable: /usr/local/bin/bun
          allowed_bots: dependabot
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the conventions in CLAUDE.md and
            server/README.md. Focus on:
            - correctness bugs and regressions
            - the permission matrix staying in sync between src/permissions.ts and
              server/src/permissions.ts, and LIMITS between src/validation.ts and
              server/src/contract.ts
            - security of API mutations (server-side re-checks, zod validation)
            - TypeScript soundness (client `npm run typecheck`, server `npm run typecheck`)

            Leave inline comments on specific lines where relevant. Keep the summary
            concise and actionable. Do not approve or request changes formally —
            just comment.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Automated PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the conventions in CLAUDE.md and
            server/README.md. Focus on:
            - correctness bugs and regressions
            - the permission matrix staying in sync between src/permissions.ts and
              server/src/permissions.ts, and LIMITS between src/validation.ts and
              server/src/contract.ts
            - security of API mutations (server-side re-checks, zod validation)
            - TypeScript soundness (client `npm run typecheck`, server `npm run typecheck`)

            Leave inline comments on specific lines where relevant. Keep the summary
            concise and actionable. Do not approve or request changes formally —
            just comment.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"

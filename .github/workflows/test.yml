name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: dependency and image security
    runs-on: ubuntu-24.04
    # Image tests use fixed container names and ports; keep them serialized.
    concurrency:
      group: taskira-image-security
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-test-runner
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Fail on high or critical npm advisories (client)
        run: npm audit --audit-level=high
      - name: Fail on high or critical npm advisories (server)
        run: npm audit --audit-level=high
        working-directory: server
      - name: Validate vulnerability exception policy
        run: bash scripts/check-trivy-ignore.sh
      - name: Validate source and release Compose files with Docker Compose
        env:
          POSTGRES_PASSWORD: compose-check
          JWT_SECRET: compose-check-12345678901234567890123456789012
          ADMIN_PASSWORD: Compose-Check-42!Secure
          CORS_ORIGIN: http://127.0.0.1:8081
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          release_compose="$(mktemp)"
          scripts/render-compose.sh release 9.8.7-test > "$release_compose"
          docker compose -f "$release_compose" config >/dev/null
          for fixture in ldap storage mail; do
            docker compose -f "server/docker-compose.$fixture.yml" config >/dev/null
          done
          env TASKIRA_LDAP_CONTAINER_NAME=taskira-ci-ldap-config TASKIRA_LDAP_PORT_BINDING=127.0.0.1::389 \
            docker compose -f server/docker-compose.ldap.yml config >/dev/null
          env TASKIRA_S3_CONTAINER_NAME=taskira-ci-s3-config TASKIRA_S3_BUCKET_CONTAINER_NAME=taskira-ci-bucket-config TASKIRA_S3_PORT_BINDING=127.0.0.1::9000 \
            docker compose -f server/docker-compose.storage.yml config >/dev/null
          env TASKIRA_MAIL_CONTAINER_NAME=taskira-ci-mail-config TASKIRA_SMTP_PORT_BINDING=127.0.0.1::1025 TASKIRA_MAIL_API_PORT_BINDING=127.0.0.1::8025 \
            docker compose -f server/docker-compose.mail.yml config >/dev/null
      - name: Build images for scanning
        run: |
          docker build -t taskira-client:security .
          docker build --build-arg TASKIRA_VERSION=security -t taskira-server:security server
      - name: Server rejects default administrator credentials
        run: |
          if docker run --rm \
            -e DATABASE_URL=postgresql://unused:unused@127.0.0.1:1/unused \
            -e JWT_SECRET=ci-security-secret-000000000000000000000 \
            -e ADMIN_USERNAME=admin -e ADMIN_PASSWORD=admin \
            taskira-server:security >default-credentials.log 2>&1; then
            echo "::error::server accepted default administrator credentials"
            exit 1
          fi
          grep -F "ADMIN_PASSWORD" default-credentials.log
      - name: Verify frontend security headers
        run: |
          docker run -d --rm --name taskira-security-headers -p 18080:80 --add-host server:127.0.0.1 taskira-client:security
          trap 'docker stop taskira-security-headers >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:18080/healthz >/dev/null && break; sleep 1; done
          bash scripts/test-security-headers.sh
      - name: Verify real nginx IP boundary and configurable multipart limits
        run: bash scripts/test-proxy-integration.sh
      - name: Trivy client image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskira-client:security
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          trivyignores: .trivyignore.yaml
      - name: Trivy server image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskira-server:security
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          trivyignores: .trivyignore.yaml

  secrets-scan:
    name: secret scan (full git history)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # without full history gitleaks would scan one commit only
      - uses: ./.github/actions/prepare-test-runner
        with:
          docker: 'false'
      - name: Install pinned gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan whole history (secrets redacted in output)
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml --verbose .

  snapshot-list:
    runs-on: ubuntu-24.04
    outputs:
      snapshots: ${{ steps.snapshots.outputs.json }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-test-runner
        with:
          docker: 'false'
      - id: snapshots
        name: Discover database snapshots
        run: |
          json="$(find fixtures/db-snapshots -maxdepth 1 -type f -name '*.sql' -printf '%p\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          test "$json" != "[]"
          echo "json=$json" >> "$GITHUB_OUTPUT"

  upgrade-from-snapshot:
    name: upgrade from snapshot (${{ matrix.snapshot }})
    needs: snapshot-list
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        snapshot: ${{ fromJson(needs.snapshot-list.outputs.snapshots) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskira
          POSTGRES_PASSWORD: taskira
          POSTGRES_DB: taskira_upgrade
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://taskira:taskira@localhost:5432/taskira_upgrade
      JWT_SECRET: upgrade-snapshot-ci-secret-0000000000000000
      ADMIN_USERNAME: upgrade_admin
      ADMIN_PASSWORD: Snapshot-Secure-42!
      ADMIN_NAME: Upgrade Admin
      RATE_LIMIT_ENABLED: "false"
      NOTIFY_WORKER_ENABLED: "false"
      MAINTENANCE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-test-runner
        with:
          postgres: 'true'
          postgres-port: ${{ job.services.postgres.ports[5432] }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      - name: Verify interrupted concurrent-index recovery
        run: node scripts/test-concurrent-index-recovery.mjs
        working-directory: server
      - name: Restore snapshot, migrate, start, and smoke-test
        run: node scripts/upgrade-snapshot-smoke.mjs "../${{ matrix.snapshot }}"
        working-directory: server

  upgrade-procedure:
    name: offline upgrade and rollback
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/prepare-test-runner
      # OPS-UPG-01: the job always runs (stable check name), but on a PR the heavy
      # step runs only when upgrade-relevant paths changed. Pushes to main always
      # run it; the nightly run is .github/workflows/upgrade-nightly.yml.
      - name: Decide whether upgrade-relevant paths changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed="$(git diff --name-only "$BASE_SHA"...HEAD -- \
            'server/migrations/**' 'scripts/**' 'Dockerfile*' '**/Dockerfile*' \
            'docker-compose*.yml' '**/docker-compose*.yml' 'compose*.yml' 'nginx.conf' \
            'fixtures/db-snapshots/**' '.github/workflows/test.yml' \
            'server/src/**' 'src/**' 'deploy/**' '.dockerignore' 'vite.config.*' \
            'shared/**' 'public/**' 'index.html' 'tsconfig*.json' 'server/tsconfig*.json' \
            'tailwind.config.*' 'postcss.config.*' \
            'server/package*.json' 'package*.json' \
            '.github/actions/prepare-test-runner/**' '.github/scripts/**' \
            '.github/workflows/upgrade-nightly.yml')"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine changed paths; running the upgrade test."
          elif [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No upgrade-relevant paths changed; skipping (nightly run covers main)."
          fi
      - name: Build versioned images, upgrade from the latest release tag, and roll back
        if: steps.scope.outputs.run == 'true'
        run: bash scripts/test-upgrade-integration.sh

  backup-restore-rehearsal:
    name: backup, destroy volumes, and restore
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-test-runner
      - name: Back up data, remove volumes, restore, and verify login/task/attachment
        run: bash scripts/test-backup-restore-integration.sh

  migration-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/prepare-test-runner
        with:
          docker: 'false'

      - name: Self-test migration policy guard
        run: bash scripts/test-migration-policy.sh

      - name: Check changed migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check-migrations.sh "$BASE_SHA" "$HEAD_SHA"

  server:
    name: server (postgres ${{ matrix.pg }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "15", "16", "17"] # все заявленные: 14 = PG_MIN_MAJOR, 17 = PG_MAX_TESTED_MAJOR (server/src/services/pgVersion.ts); 16 — версия поставки (compose)

    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: taskira
          POSTGRES_PASSWORD: taskira
          POSTGRES_DB: taskira_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL_TEST: postgresql://taskira:taskira@localhost:5432/taskira_test

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-test-runner
        with:
          postgres: 'true'
          postgres-port: ${{ job.services.postgres.ports[5432] }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # esbuild (зависимость vitest) тянет платформенный бинарь в postinstall;
      # на некоторых версиях npm он не выполняется при `npm ci` — форсим.
      - run: npm rebuild esbuild

      - run: npm run typecheck

      - run: npm test

  server-summary:
    # Keep the stable check name even when PostgreSQL matrix members change.
    name: server
    needs: server
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every PostgreSQL suite to pass
        env:
          MATRIX_RESULT: ${{ needs.server.result }}
        run: test "$MATRIX_RESULT" = success

  # Контракт клиент↔сервер (ТЗ 2.1): клиентские типы выводятся из server/src/contract.ts, поэтому правка серверных
  # типов может сломать клиент и наоборот. Оба typecheck в ОДНОЙ джобе — один статус проверки на PR, а не два,
  # которые можно смёржить по отдельности. Чтобы он реально блокировал мерж, джоба должна быть required check в
  # настройках ветки (на бесплатном приватном репозитории GitHub эту настройку не даёт — см. docs/tickets/UI-02).
  types:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-test-runner
        with:
          docker: 'false'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - run: npm ci
      - run: npm ci
        working-directory: server

      - name: Typecheck server
        run: npm run typecheck
        working-directory: server

      # ТЗ 4.3: server/scripts/generate-license.ts и install-license.ts — вне server/tsconfig.json
      # (rootDir: src), тот же случай, что и корневой scripts/ ниже.
      - name: Typecheck server/scripts (license CLI)
        run: npm run typecheck:scripts
        working-directory: server
      - name: Load tool dependency compatibility
        run: npm run perf:tool:check
        working-directory: server

      - name: Typecheck client (includes server/src/contract.ts)
        run: npm run typecheck

      # ТЗ 2.4: генератор документации (scripts/generate-docs.ts) — TypeScript вне tsconfig клиента и сервера, проверяем отдельно.
      - name: Typecheck scripts/ (docs generator)
        run: npm run typecheck:scripts

      # ТЗ 2.2: матрица прав генерируется из shared/permissions.matrix.json; ручная правка любой копии или docs/PERMISSIONS.md — красный чек.
      - name: Permissions matrix is in sync with its single source
        run: npm run permissions:check

      # ТЗ 2.4: список миграций и справочник схем API порождаются из кода; ручная правка — красный чек.
      - name: Generated docs (migration list, API schemas) are up to date
        run: npm run docs:check

  # Клиент (корневой пакет): typecheck + прод-сборка. БД не нужна.
  # В CI клиент раньше не проверялся вообще — единственный барьер против
  # красной сборки перед тяжёлой работой над UI.
  client:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          # build-release.sh deliberately rejects shallow history because it
          # cannot generate a trustworthy CHANGELOG.md from an incomplete log.
          fetch-depth: 0
      - uses: ./.github/actions/prepare-test-runner
        with:
          docker: 'false'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - name: Design tokens — contrast of text/background pairs (ТЗ 5.4)
        run: npm run contrast:check

      - name: Design tokens — no raw colours outside tokens.css (ТЗ 5.4)
        run: npm run colors:check

      - name: Motion — durations from tokens, ≤ 450 ms, reduced-motion covered (ТЗ 5.13)
        run: npm run motion:check

      - name: Anti-list — no caps labels or arrows in button text (DESIGN.md, ТЗ 5.16)
        run: npm run antilist:check

      - run: npm test

      - run: npm run build

      - name: Bundle size budget — JS/CSS gzip vs scripts/bundle-budget.json (ТЗ 5.2)
        run: npm run bundle:check

      - name: Validate offline release scripts
        run: bash scripts/test-release-scripts.sh

  # Отдельный job: LDAP-путь против НАСТОЯЩЕГО OpenLDAP (не мока).
  # AUTH_MODE=ldap здесь только для этого job — основной `server` job идёт в local.
  ldap:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskira
          POSTGRES_PASSWORD: taskira
          POSTGRES_DB: taskira_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL_TEST: postgresql://taskira:taskira@localhost:5432/taskira_test
      JWT_SECRET: ci-ldap-job-jwt-secret-0000000000000000
      AUTH_MODE: ldap
      COMPOSE_PROJECT_NAME: taskira-ldap-${{ github.run_id }}-${{ github.run_attempt }}
      TASKIRA_LDAP_CONTAINER_NAME: taskira-ldap-${{ github.run_id }}-${{ github.run_attempt }}
      TASKIRA_LDAP_PORT_BINDING: '127.0.0.1::389'
      LDAP_URL: ldap://localhost:389
      LDAP_BIND_DN: cn=admin,dc=taskira,dc=test
      LDAP_BIND_PASSWORD: admin
      LDAP_USER_BASE_DN: ou=people,dc=taskira,dc=test
      LDAP_USER_FILTER: (uid={username})
      LDAP_GROUP_MEMBERSHIP: search
      LDAP_GROUP_BASE_DN: ou=groups,dc=taskira,dc=test
      LDAP_ADMIN_GROUP_DN: cn=taskira-admins,ou=groups,dc=taskira,dc=test
      LDAP_ATTR_LOGIN: uid
      LDAP_ATTR_NAME: cn
      LDAP_ATTR_MAIL: mail
      ADMIN_USERNAME: breakglass
      ADMIN_PASSWORD: Emergency-Access-42!

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-test-runner
        with:
          postgres: 'true'
          postgres-port: ${{ job.services.postgres.ports[5432] }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm rebuild esbuild

      - name: Start OpenLDAP (osixia/openldap:1.5.0)
        run: |
          docker compose -f docker-compose.ldap.yml up -d
          address="$(docker compose -f docker-compose.ldap.yml port openldap 389)"
          [[ "$address" =~ ^127\.0\.0\.1:[0-9]+$ ]] || { echo '::error::LDAP published port is unavailable'; exit 1; }
          printf 'LDAP_URL=ldap://%s\n' "$address" >> "$GITHUB_ENV"

      - name: Wait for slapd
        run: |
          for i in $(seq 1 50); do
            # RootDSE читается анонимно — значит slapd слушает и отвечает
            if docker compose -f docker-compose.ldap.yml exec -T openldap \
                 ldapsearch -x -LLL -H ldap://localhost:389 -b "" -s base namingContexts >/dev/null 2>&1; then
              echo "slapd отвечает (${i} попыток)"; exit 0
            fi
            sleep 3
          done
          echo "::error::slapd не поднялся"
          docker compose -f docker-compose.ldap.yml logs openldap
          exit 1

      - name: Load bootstrap.ldif
        run: |
          docker compose -f docker-compose.ldap.yml exec -T openldap \
            ldapadd -x -c -H ldap://localhost:389 -D cn=admin,dc=taskira,dc=test -w admin -f /ldifs/bootstrap.ldif

      # Дефолтный ACL osixia ("by self read by * none") не даёт обычному
      # пользователю искать по ou=groups / ou=bulk — тесты sizelimit/paged тогда
      # падают с noSuchObject. Разрешаем "by users read" (см. test/ldap/acl.ldif).
      - name: Relax ACL (authenticated users can read the tree)
        run: |
          docker compose -f docker-compose.ldap.yml exec -T openldap \
            ldapmodify -x -H ldap://localhost:389 -D cn=admin,cn=config -w config -f /ldifs/acl.ldif

      - name: Show LDAP tree (sanity)
        run: |
          docker compose -f docker-compose.ldap.yml exec -T openldap \
            ldapsearch -x -H ldap://localhost:389 -b dc=taskira,dc=test \
            -D cn=admin,dc=taskira,dc=test -w admin dn

      - run: npm run test:ldap

      - name: OpenLDAP logs
        if: always()
        run: docker compose -f docker-compose.ldap.yml logs openldap
      - name: Remove this LDAP fixture
        if: always()
        run: docker compose -f docker-compose.ldap.yml down -v

  # Отдельный job: драйвер вложений STORAGE_DRIVER=s3 против НАСТОЯЩЕГО S3-сервера
  # (SeaweedFS, не заглушки; образы MinIO с 28.09.2026 недоступны без авторизации —
  # см. server/docker-compose.storage.yml). Основной `server` job идёт в STORAGE_DRIVER=local.
  storage-s3:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskira
          POSTGRES_PASSWORD: taskira
          POSTGRES_DB: taskira_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL_TEST: postgresql://taskira:taskira@localhost:5432/taskira_test
      JWT_SECRET: ci-storage-job-jwt-secret-0000000000000000
      STORAGE_DRIVER: s3
      COMPOSE_PROJECT_NAME: taskira-s3-${{ github.run_id }}-${{ github.run_attempt }}
      TASKIRA_S3_CONTAINER_NAME: taskira-s3-${{ github.run_id }}-${{ github.run_attempt }}
      TASKIRA_S3_BUCKET_CONTAINER_NAME: taskira-s3-bucket-${{ github.run_id }}-${{ github.run_attempt }}
      TASKIRA_S3_PORT_BINDING: '127.0.0.1::9000'
      STORAGE_S3_ENDPOINT: http://localhost:9000
      STORAGE_S3_BUCKET: taskira-attachments
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ACCESS_KEY: taskira
      STORAGE_S3_SECRET_KEY: taskira-minio-dev
      STORAGE_S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-test-runner
        with:
          postgres: 'true'
          postgres-port: ${{ job.services.postgres.ports[5432] }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm rebuild esbuild

      - name: Start S3 (SeaweedFS) + create bucket
        run: |
          docker compose -f docker-compose.storage.yml up -d
          address="$(docker compose -f docker-compose.storage.yml port s3 9000)"
          [[ "$address" =~ ^127\.0\.0\.1:[0-9]+$ ]] || { echo '::error::S3 published port is unavailable'; exit 1; }
          printf 'STORAGE_S3_ENDPOINT=http://%s\n' "$address" >> "$GITHUB_ENV"

      - name: Wait for bucket (createbucket exits 0)
        run: docker compose -f docker-compose.storage.yml wait createbucket

      - name: Bucket sanity
        run: docker compose -f docker-compose.storage.yml logs createbucket

      - run: npm run test:storage

      - name: S3 server logs
        if: always()
        run: docker compose -f docker-compose.storage.yml logs s3
      - name: Remove this S3 fixture and its volume
        if: always()
        run: docker compose -f docker-compose.storage.yml down -v

  # Отдельный job: email-воркер уведомлений против НАСТОЯЩЕГО SMTP (Mailpit).
  # Основной `server` job идёт с NOTIFY_EMAIL_ENABLED unset — воркер не стартует.
  mail:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskira
          POSTGRES_PASSWORD: taskira
          POSTGRES_DB: taskira_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL_TEST: postgresql://taskira:taskira@localhost:5432/taskira_test
      JWT_SECRET: ci-mail-job-jwt-secret-00000000000000000
      NOTIFY_EMAIL_ENABLED: "true"
      COMPOSE_PROJECT_NAME: taskira-mail-${{ github.run_id }}-${{ github.run_attempt }}
      TASKIRA_MAIL_CONTAINER_NAME: taskira-mail-${{ github.run_id }}-${{ github.run_attempt }}
      TASKIRA_SMTP_PORT_BINDING: '127.0.0.1::1025'
      TASKIRA_MAIL_API_PORT_BINDING: '127.0.0.1::8025'
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: Taskira <noreply@taskira.test>
      APP_BASE_URL: https://taskira.ci
      MAIL_KIND: mailpit
      MAIL_API: http://localhost:8025

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-test-runner
        with:
          postgres: 'true'
          postgres-port: ${{ job.services.postgres.ports[5432] }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm rebuild esbuild

      - name: Start Mailpit
        run: |
          docker compose -f docker-compose.mail.yml up -d
          smtp="$(docker compose -f docker-compose.mail.yml port mailpit 1025)"
          api="$(docker compose -f docker-compose.mail.yml port mailpit 8025)"
          for address in "$smtp" "$api"; do
            [[ "$address" =~ ^127\.0\.0\.1:[0-9]+$ ]] || { echo '::error::Mailpit published port is unavailable'; exit 1; }
          done
          printf 'SMTP_PORT=%s\nMAIL_API=http://%s\n' "${smtp##*:}" "$api" >> "$GITHUB_ENV"

      - name: Wait for Mailpit API
        run: |
          for i in $(seq 1 40); do
            curl -sf "$MAIL_API/api/v1/messages" >/dev/null 2>&1 && { echo "mailpit up ($i)"; exit 0; }
            sleep 2
          done
          echo "::error::Mailpit не поднялся"
          docker compose -f docker-compose.mail.yml logs mailpit
          exit 1

      - run: npm run test:mail

      - name: Mailpit logs
        if: always()
        run: docker compose -f docker-compose.mail.yml logs mailpit
      - name: Remove this Mailpit fixture
        if: always()
        run: docker compose -f docker-compose.mail.yml down -v

name: server tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskira
          POSTGRES_PASSWORD: taskira
          POSTGRES_DB: taskira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL_TEST: postgresql://taskira:taskira@localhost:5432/taskira_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # esbuild (зависимость vitest) тянет платформенный бинарь в postinstall;
      # на некоторых версиях npm он не выполняется при `npm ci` — форсим.
      - run: npm rebuild esbuild

      - run: npm run typecheck

      - run: npm test

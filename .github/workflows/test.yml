name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    name: dependency and image security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Fail on high or critical npm advisories (client)
        run: npm audit --audit-level=high
      - name: Fail on high or critical npm advisories (server)
        run: npm audit --audit-level=high
        working-directory: server
      - name: Validate vulnerability exception policy
        run: bash scripts/check-trivy-ignore.sh
      - name: Build images for scanning
        run: |
          docker build -t taskira-client:security .
          docker build --build-arg TASKIRA_VERSION=security -t taskira-server:security server
      - name: Server rejects default administrator credentials
        run: |
          if docker run --rm \
            -e DATABASE_URL=postgresql://unused:unused@127.0.0.1:1/unused \
            -e JWT_SECRET=ci-security-secret-000000000000000000000 \
            -e ADMIN_USERNAME=admin -e ADMIN_PASSWORD=admin \
            taskira-server:security >default-credentials.log 2>&1; then
            echo "::error::server accepted default administrator credentials"
            exit 1
          fi
          grep -F "ADMIN_PASSWORD" default-credentials.log
      - name: Verify frontend security headers
        run: |
          docker run -d --rm --name taskira-security-headers -p 18080:80 --add-host server:127.0.0.1 taskira-client:security
          trap 'docker stop taskira-security-headers >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:18080/healthz >/dev/null && break; sleep 1; done
          bash scripts/test-security-headers.sh
      - name: Trivy client image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskira-client:security
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          trivyignores: .trivyignore.yaml
      - name: Trivy server image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskira-server:security
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          trivyignores: .trivyignore.yaml

  snapshot-list:
    runs-on: ubuntu-latest
    outputs:
      snapshots: ${{ steps.snapshots.outputs.json }}
    steps:
      - uses: actions/checkout@v7
      - id: snapshots
        name: Discover database snapshots
        run: |
          json="$(find fixtures/db-snapshots -maxdepth 1 -type f -name '*.sql' -printf '%p\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          test "$json" != "[]"
          echo "json=$json" >> "$GITHUB_OUTPUT"

  upgrade-from-snapshot:
    name: upgrade from snapshot (${{ matrix.snapshot }})
    needs: snapshot-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        snapshot: ${{ fromJson(needs.snapshot-list.outputs.snapshots) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskira
          POSTGRES_PASSWORD: taskira
          POSTGRES_DB: taskira_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://taskira:taskira@localhost:5432/taskira_upgrade
      JWT_SECRET: upgrade-snapshot-ci-secret-0000000000000000
      ADMIN_USERNAME: upgrade_admin
      ADMIN_PASSWORD: Snapshot-Secure-42!
      ADMIN_NAME: Upgrade Admin
      RATE_LIMIT_ENABLED: "false"
      NOTIFY_WORKER_ENABLED: "false"
      MAINTENANCE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      - name: Verify interrupted concurrent-index recovery
        run: node scripts/test-concurrent-index-recovery.mjs
        working-directory: server
      - name: Restore snapshot, migrate, start, and smoke-test
        run: node scripts/upgrade-snapshot-smoke.mjs "../${{ matrix.snapshot }}"
        working-directory: server

  upgrade-procedure:
    name: offline upgrade and rollback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build versioned images, upgrade snapshot data, and roll back
        run: bash scripts/test-upgrade-integration.sh

  backup-restore-rehearsal:
    name: backup, destroy volumes, and restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Back up data, remove volumes, restore, and verify login/task/attachment
        run: bash scripts/test-backup-restore-integration.sh

  migration-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Self-test migration policy guard
        run: bash scripts/test-migration-policy.sh

      - name: Check changed migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/check-migrations.sh "$BASE_SHA" "$HEAD_SHA"

  server:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskira
          POSTGRES_PASSWORD: taskira
          POSTGRES_DB: taskira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL_TEST: postgresql://taskira:taskira@localhost:5432/taskira_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # esbuild (зависимость vitest) тянет платформенный бинарь в postinstall;
      # на некоторых версиях npm он не выполняется при `npm ci` — форсим.
      - run: npm rebuild esbuild

      - run: npm run typecheck

      - run: npm test

  # Клиент (корневой пакет): typecheck + прод-сборка. БД не нужна.
  # В CI клиент раньше не проверялся вообще — единственный барьер против
  # красной сборки перед тяжёлой работой над UI.
  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # build-release.sh deliberately rejects shallow history because it
          # cannot generate a trustworthy CHANGELOG.md from an incomplete log.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Validate offline release scripts
        run: bash scripts/test-release-scripts.sh

      - name: Validate source and release Compose files with Docker Compose
        env:
          POSTGRES_PASSWORD: compose-check
          JWT_SECRET: compose-check-12345678901234567890123456789012
          ADMIN_PASSWORD: Compose-Check-42!Secure
          CORS_ORIGIN: http://127.0.0.1:8081
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          release_compose="$(mktemp)"
          scripts/render-compose.sh release 9.8.7-test > "$release_compose"
          docker compose -f "$release_compose" config >/dev/null

  # Отдельный job: LDAP-путь против НАСТОЯЩЕГО OpenLDAP (не мока).
  # AUTH_MODE=ldap здесь только для этого job — основной `server` job идёт в local.
  ldap:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskira
          POSTGRES_PASSWORD: taskira
          POSTGRES_DB: taskira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL_TEST: postgresql://taskira:taskira@localhost:5432/taskira_test
      JWT_SECRET: ci-ldap-job-jwt-secret-0000000000000000
      AUTH_MODE: ldap
      LDAP_URL: ldap://localhost:389
      LDAP_BIND_DN: cn=admin,dc=taskira,dc=test
      LDAP_BIND_PASSWORD: admin
      LDAP_USER_BASE_DN: ou=people,dc=taskira,dc=test
      LDAP_USER_FILTER: (uid={username})
      LDAP_GROUP_MEMBERSHIP: search
      LDAP_GROUP_BASE_DN: ou=groups,dc=taskira,dc=test
      LDAP_ADMIN_GROUP_DN: cn=taskira-admins,ou=groups,dc=taskira,dc=test
      LDAP_ATTR_LOGIN: uid
      LDAP_ATTR_NAME: cn
      LDAP_ATTR_MAIL: mail
      ADMIN_USERNAME: breakglass
      ADMIN_PASSWORD: Emergency-Access-42!

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm rebuild esbuild

      - name: Start OpenLDAP (osixia/openldap:1.5.0)
        run: docker compose -f docker-compose.ldap.yml up -d

      - name: Wait for slapd
        run: |
          for i in $(seq 1 50); do
            # RootDSE читается анонимно — значит slapd слушает и отвечает
            if docker compose -f docker-compose.ldap.yml exec -T openldap \
                 ldapsearch -x -LLL -H ldap://localhost:389 -b "" -s base namingContexts >/dev/null 2>&1; then
              echo "slapd отвечает (${i} попыток)"; exit 0
            fi
            sleep 3
          done
          echo "::error::slapd не поднялся"
          docker compose -f docker-compose.ldap.yml logs openldap
          exit 1

      - name: Load bootstrap.ldif
        run: |
          docker compose -f docker-compose.ldap.yml exec -T openldap \
            ldapadd -x -c -H ldap://localhost:389 -D cn=admin,dc=taskira,dc=test -w admin -f /ldifs/bootstrap.ldif

      # Дефолтный ACL osixia ("by self read by * none") не даёт обычному
      # пользователю искать по ou=groups / ou=bulk — тесты sizelimit/paged тогда
      # падают с noSuchObject. Разрешаем "by users read" (см. test/ldap/acl.ldif).
      - name: Relax ACL (authenticated users can read the tree)
        run: |
          docker compose -f docker-compose.ldap.yml exec -T openldap \
            ldapmodify -x -H ldap://localhost:389 -D cn=admin,cn=config -w config -f /ldifs/acl.ldif

      - name: Show LDAP tree (sanity)
        run: |
          docker compose -f docker-compose.ldap.yml exec -T openldap \
            ldapsearch -x -H ldap://localhost:389 -b dc=taskira,dc=test \
            -D cn=admin,dc=taskira,dc=test -w admin dn

      - run: npm run test:ldap

      - name: OpenLDAP logs
        if: always()
        run: docker compose -f docker-compose.ldap.yml logs openldap

  # Отдельный job: драйвер вложений STORAGE_DRIVER=s3 против НАСТОЯЩЕГО MinIO
  # (не заглушки). Основной `server` job идёт в STORAGE_DRIVER=local.
  storage-s3:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskira
          POSTGRES_PASSWORD: taskira
          POSTGRES_DB: taskira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL_TEST: postgresql://taskira:taskira@localhost:5432/taskira_test
      JWT_SECRET: ci-storage-job-jwt-secret-0000000000000000
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: http://localhost:9000
      STORAGE_S3_BUCKET: taskira-attachments
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ACCESS_KEY: taskira
      STORAGE_S3_SECRET_KEY: taskira-minio-dev
      STORAGE_S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm rebuild esbuild

      - name: Start MinIO + create bucket
        run: docker compose -f docker-compose.storage.yml up -d

      - name: Wait for bucket (createbucket exits 0)
        run: docker compose -f docker-compose.storage.yml wait createbucket

      - name: Bucket sanity
        run: docker compose -f docker-compose.storage.yml logs createbucket

      - run: npm run test:storage

      - name: MinIO logs
        if: always()
        run: docker compose -f docker-compose.storage.yml logs minio

  # Отдельный job: email-воркер уведомлений против НАСТОЯЩЕГО SMTP (Mailpit).
  # Основной `server` job идёт с NOTIFY_EMAIL_ENABLED unset — воркер не стартует.
  mail:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskira
          POSTGRES_PASSWORD: taskira
          POSTGRES_DB: taskira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL_TEST: postgresql://taskira:taskira@localhost:5432/taskira_test
      JWT_SECRET: ci-mail-job-jwt-secret-00000000000000000
      NOTIFY_EMAIL_ENABLED: "true"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: Taskira <noreply@taskira.test>
      APP_BASE_URL: https://taskira.ci
      MAIL_KIND: mailpit
      MAIL_API: http://localhost:8025

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm rebuild esbuild

      - name: Start Mailpit
        run: docker compose -f docker-compose.mail.yml up -d

      - name: Wait for Mailpit API
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:8025/api/v1/messages >/dev/null 2>&1 && { echo "mailpit up ($i)"; exit 0; }
            sleep 2
          done
          echo "::error::Mailpit не поднялся"
          docker compose -f docker-compose.mail.yml logs mailpit
          exit 1

      - run: npm run test:mail

      - name: Mailpit logs
        if: always()
        run: docker compose -f docker-compose.mail.yml logs mailpit

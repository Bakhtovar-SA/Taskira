# Taskira source deployment. Runtime settings live in compose.common.yml and
# are shared with the offline release to prevent configuration drift.
services:
  postgres:
    extends:
      file: compose.common.yml
      service: postgres
    image: postgres:16-alpine

  server:
    extends:
      file: compose.common.yml
      service: server
    build:
      context: ./server
      args:
        TASKIRA_VERSION: ${TASKIRA_VERSION:-dev}
    ports:
      - "${SERVER_PORT:-8080}:8080"

  client:
    extends:
      file: compose.common.yml
      service: client
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_APP_VERSION: ${TASKIRA_VERSION:-dev}

volumes:
  pgdata:
  attachments:

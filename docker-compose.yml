# Полный стек Taskira: PostgreSQL + API + клиент (nginx, статика).
#
#   cp .env.example .env    # заполнить POSTGRES_PASSWORD / JWT_SECRET / ADMIN_PASSWORD
#   docker compose up -d --build
#
# Подробности, обновление образов и вариант с внешним reverse-proxy —
# DOCKER_SETUP.md. Опции сверх этого файла (LDAP/AD, S3, email) добавляются
# теми же переменными окружения, что и в server/.env.example — просто
# перечислите их в services.server.environment ниже или через env_file.
#
# Это НЕ замена внешнему TLS-терминатору из ARCHITECTURE.md («Reverse proxy —
# nginx с TLS, точка входа в корпоративной сети») — client и server публикуют
# порты по отдельности (как в dev: :3000/:8080), внешний прокси перед ними
# ставится отдельно; тогда обязателен TRUST_PROXY (см. корневой README).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан — см. .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-taskira}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskira} -d ${POSTGRES_DB:-taskira}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taskira}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskira}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан (нужно ≥32 символа) — см. .env.example}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD не задан — см. .env.example}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
      # Origin клиента, который реально увидит браузер — должен совпадать с
      # тем, куда смотрит VITE_API_URL ниже (CORS иначе отклонит запросы).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      STORAGE_DIR: /app/var/attachments
    volumes:
      - attachments:/app/var/attachments
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  client:
    build:
      context: .
      args:
        # Печётся в сборку (Vite инлайнит env на этапе build, не runtime) —
        # адрес, по которому СЕРВЕР реально доступен браузеру пользователя.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  attachments:

# Локальный S3-совместимый MinIO для разработки и CI драйвера STORAGE_DRIVER=s3
# (FILES_MIGRATION.md D1, Фаза 4). Разработка по умолчанию идёт на STORAGE_DRIVER=local
# и этот compose не нужен — он для проверки S3-пути.
#
#   docker compose -f docker-compose.storage.yml up -d
#   # createbucket поднимется сам после healthcheck minio и заведёт бакет.
#   # проверить:
#   docker compose -f docker-compose.storage.yml exec minio \
#     mc alias set local http://localhost:9000 taskira taskira-minio-dev
#   docker compose -f docker-compose.storage.yml exec minio mc ls local/
#   docker compose -f docker-compose.storage.yml down -v
#
# Консоль MinIO: http://localhost:9001  (taskira / taskira-minio-dev)
# S3 API:        http://localhost:9000
#
# Env для сервера (полный набор и реальный on-prem — STORAGE_SETUP.md, Фаза 4):
#   STORAGE_DRIVER=s3
#   STORAGE_S3_ENDPOINT=http://localhost:9000
#   STORAGE_S3_BUCKET=taskira-attachments
#   STORAGE_S3_ACCESS_KEY=taskira
#   STORAGE_S3_SECRET_KEY=taskira-minio-dev
#   STORAGE_S3_FORCE_PATH_STYLE=true

services:
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: taskira-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "taskira"
      MINIO_ROOT_PASSWORD: "taskira-minio-dev"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - taskira-minio-data:/data
    healthcheck:
      # mc бандлится в образе minio/minio; alias создаём на лету из root-кредов.
      test: ["CMD-SHELL", "mc alias set hc http://localhost:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready hc"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  # Одноразовый шаг: завести приватный бакет для вложений.
  createbucket:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: taskira-minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 taskira taskira-minio-dev &&
      mc mb --ignore-existing local/taskira-attachments &&
      mc anonymous set none local/taskira-attachments &&
      echo 'bucket taskira-attachments готов (приватный)'
      "

volumes:
  taskira-minio-data:

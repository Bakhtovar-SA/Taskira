# Локальный тестовый LDAP для разработки и CI (LDAP_MIGRATION.md D7).
# Реального корпоративного AD у нас нет — весь LDAP-путь проверяется здесь.
#
#   docker compose -f docker-compose.ldap.yml up -d
#   # проверить:
#   docker compose -f docker-compose.ldap.yml exec openldap \
#     ldapsearch -x -H ldap://localhost:1389 -b dc=taskira,dc=test \
#     -D cn=admin,dc=taskira,dc=test -w admin dn
#   docker compose -f docker-compose.ldap.yml down -v   # -v — сбросить данные
#
# Образ bitnami/openldap слушает 1389 (LDAP) / 1636 (LDAPS) внутри контейнера
# (non-root), наружу мапим 389. Кастомный LDIF из test/ldap/*.ldif грузится
# ПОСЛЕ создания суффикса dc=taskira,dc=test (LDAP_SKIP_DEFAULT_TREE=yes).

services:
  openldap:
    image: bitnami/openldap:2.6
    container_name: taskira-openldap
    environment:
      LDAP_ROOT: "dc=taskira,dc=test"
      LDAP_ADMIN_USERNAME: "admin"          # ⇒ cn=admin,dc=taskira,dc=test
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_ADMIN_ENABLED: "no"
      LDAP_SKIP_DEFAULT_TREE: "yes"         # не создавать демо ou=users/ou=groups
      LDAP_CUSTOM_LDIF_DIR: "/ldifs"        # грузим test/ldap/*.ldif
      LDAP_ALLOW_ANON_BINDING: "no"
    volumes:
      - ./test/ldap:/ldifs:ro
    ports:
      - "389:1389"
    healthcheck:
      test:
        - CMD
        - ldapsearch
        - "-x"
        - "-H"
        - "ldap://localhost:1389"
        - "-D"
        - "cn=admin,dc=taskira,dc=test"
        - "-w"
        - "admin"
        - "-b"
        - "dc=taskira,dc=test"
        - "-s"
        - "base"
        - "dn"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

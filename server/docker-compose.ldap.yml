# Локальный тестовый LDAP для разработки и CI (LDAP_MIGRATION.md D7).
# Реального корпоративного AD у нас нет — весь LDAP-путь проверяется здесь.
#
#   docker compose -f docker-compose.ldap.yml up -d
#   # проверить:  ldapsearch -x -H ldap://localhost:389 -b dc=taskira,dc=test \
#   #               -D cn=admin,dc=taskira,dc=test -w admin "(objectClass=*)"
#   docker compose -f docker-compose.ldap.yml down -v   # -v — сбросить данные
#
# Кастомный bootstrap.ldif грузится ТОЛЬКО при первом старте на пустом томе.
# Меняли схему → `down -v` и заново. Детали — test/ldap/README.md.

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: taskira-openldap
    command: ["--copy-service"] # нужно, когда монтируем свои assets
    environment:
      LDAP_ORGANISATION: "Taskira Test"
      LDAP_DOMAIN: "taskira.test"            # ⇒ база dc=taskira,dc=test
      LDAP_ADMIN_PASSWORD: "admin"           # cn=admin,dc=taskira,dc=test
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_TLS: "false"                       # тесту TLS не нужен; для AD см. LDAP_SETUP.md
    volumes:
      - ./test/ldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-taskira.ldif:ro
    ports:
      - "389:389"
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost:389", "-b", "dc=taskira,dc=test", "-s", "base"]
      interval: 5s
      timeout: 5s
      retries: 12

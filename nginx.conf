server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Для docker-compose healthcheck — не должен зависеть от статических файлов.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Vite кладёт хэш в имя файла (assets/index-<hash>.js) — можно кэшировать
    # агрессивно и бессрочно, новый билд получит новое имя.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html — наоборот, без кэша: иначе браузер годами не увидит новый билд
    # (хэш-роутинг Taskira не трогает путь, всегда отдаём один и тот же файл).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Behind a corporate LB, mount a file with set_real_ip_from (only LB CIDRs),
    # real_ip_header X-Forwarded-For and real_ip_recursive on. Empty at the edge.
    include /etc/nginx/taskira-real-ip/*.conf;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'none'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Для docker-compose healthcheck — не должен зависеть от статических файлов.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Единая точка входа для переносимого offline-релиза. Браузер всегда
    # обращается к origin клиента, а nginx маршрутизирует HTTP и WebSocket к
    # API по внутреннему DNS-имени compose-сервиса. Поэтому адрес хоста не
    # нужно впекать в client image во время сборки.
    # Only file upload endpoints bypass nginx's fixed body limit. The API
    # enforces their finite multipart, file and field limits while streaming.
    location ~ ^/api/(projects/[^/]+/issues/[^/]+/attachments|projects/[^/]+/background-photo|me/avatar|admin/brand/logo)$ {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 1m;
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This nginx is the public trust boundary: discard client-supplied XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The application WebSocket is intentionally idle between events.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Vite кладёт хэш в имя файла (assets/index-<hash>.js) — можно кэшировать
    # агрессивно и бессрочно, новый билд получит новое имя.
    location /assets/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'none'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html — наоборот, без кэша: иначе браузер годами не увидит новый билд.
    # С реальными путями роутера (ТЗ 3.1, /p/:projectKey/...) это вдвойне важно:
    # `location /` ниже отдаёт именно этот файл для ЛЮБОГО такого пути (SPA
    # fallback, try_files) — устаревший закэшированный index.html означал бы, что
    # прямые ссылки на задачу открывают старую версию клиента.
    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'none'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
